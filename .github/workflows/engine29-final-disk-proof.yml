name: Engine29 Final Independent Disk Receipt Proof
on:
  push:
    branches:
      - audit/engine29-final-disk-proof-20261123
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      E29_VERIFIER_TOKEN: ${{ secrets.ENGINE_CRON_TOKEN }}
    steps:
      - name: Authenticated metadata-only production receipt verification
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base='https://frye-market-backend-1.onrender.com';
          const token=process.env.E29_VERIFIER_TOKEN;
          const date='2026-11-23';
          const filename='2026-11-23T19-12-04-931Z-d874bda5-7e9a-4617-bac3-4b21bd8282f5.json';
          const observedAt='2026-11-23T19:11:43.878Z';
          async function read(path) {
            const response=await fetch(base+path,{headers:{accept:'application/json','cache-control':'no-store'},signal:AbortSignal.timeout(25000)});
            if(!response.ok)throw new Error('PUBLIC_REPLAY_READ_HTTP_'+response.status);
            return response.json();
          }
          const listing=await read('/api/v1/replay/es/times?date='+date);
          const times=(listing.times||[]).slice(-100);
          let found=null;
          for(const time of times.slice().reverse()){
            const snap=await read('/api/v1/replay/es/snapshot?date='+date+'&time='+encodeURIComponent(time));
            if(snap?.engine29DownstreamContext?.timestamp===observedAt) {
              found={time,snapshotTime:snap.snapshotTime};break;
            }
          }
          if(!found){console.error('NO_MATCHING_ES_REPLAY_SNAPSHOT',{searchCount:times.length,observedAt});process.exit(3);}
          console.log('MATCHED_REPLAY_METADATA',JSON.stringify({date,replayTime:found.time,replaySnapshotTime:found.snapshotTime,observationTime:observedAt}));
          if(!token){console.error('AUTH_SECRET_UNAVAILABLE');process.exit(2);}
          const query=new URLSearchParams({date,filename,replayDate:date,replayTime:found.time});
          const endpoint='/api/v1/engine29/receipt-verify?'+query.toString();
          const unauthorized=await fetch(base+endpoint,{headers:{accept:'application/json'},signal:AbortSignal.timeout(20000)});
          assert.equal(unauthorized.status,401,'PRODUCTION_AUTH_FAIL_OPEN');
          const response=await fetch(base+endpoint,{headers:{accept:'application/json','X-ENGINE-CRON-TOKEN':token},signal:AbortSignal.timeout(30000)});
          const result=await response.json();
          const text=JSON.stringify(result);
          assert.ok(!text.includes(token),'TOKEN_LEAK');
          assert.ok(!text.includes('/var/data'),'FILESYSTEM_PATH_LEAK');
          for(const rawKey of ['marketCharacter','symbols','receiptJson','credentials','rawReceipt','secrets']) {
            assert.ok(!Object.hasOwn(result,rawKey),'UNEXPECTED_RESPONSE_FIELD_'+rawKey);
          }
          if(response.status!==200) {
            console.error('PRODUCTION_PROOF_FAILED',JSON.stringify({
              http:response.status,reason:result?.reason,verified:result?.verified,exactMatch:result?.exactMatch,
              replayTime:found.time
            }));
            process.exit(4);
          }
          assert.equal(result.schema,'engine29.downstreamContext.v1');
          assert.equal(result.verified,true);
          assert.equal(result.exactMatch,true);
          assert.equal(result.reason,'VERIFIED');
          assert.match(result.receiptFileSha256,/^[a-f0-9]{64}$/);
          assert.match(result.receiptContextSha256,/^[a-f0-9]{64}$/);
          assert.equal(result.receiptContextSha256,result.replayContextSha256);
          assert.equal(result.receiptTimestamp,observedAt);
          assert.equal(result.replaySnapshot.timestamp,found.snapshotTime);
          assert.ok(Date.parse(result.receiptTimestamp)<=Date.parse(result.replaySnapshot.timestamp),'LOOKAHEAD');
          console.log('ENGINE29_FINAL_DISK_PROOF_PASS',JSON.stringify({
            schema:result.schema,
            receiptTimestamp:result.receiptTimestamp,
            receiptByteCount:result.byteCount,
            receiptFileSha256:result.receiptFileSha256,
            receiptContextSha256:result.receiptContextSha256,
            replayContextSha256:result.replayContextSha256,
            replaySnapshot:result.replaySnapshot,
            exactMatch:result.exactMatch,
            reason:result.reason,
            verified:result.verified,
            unauthorizedStatus:unauthorized.status,
            metadataOnly:true,
            lookahead:false
          }));
          JS
