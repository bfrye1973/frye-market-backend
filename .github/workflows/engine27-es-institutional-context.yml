name: Engine27 ES Institutional Source Validation
on:
  pull_request:
    paths:
      - "services/core/logic/engine27/crossMarket/readEsInstitutionalContextV1.js"
      - "services/core/tests/engine27EsInstitutionalContextV1.test.js"
      - "services/core/jobs/buildStrategySnapshot.js"
      - ".github/workflows/engine27-es-institutional-context.yml"
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test services/core/tests/engine27EsInstitutionalContextV1.test.js
      - run: node --check services/core/jobs/buildStrategySnapshot.js
