name: Engine18 Track B level-event detector (offline)
on:
  pull_request:
    paths:
      - 'services/core/logic/engine18/engine18LevelEventDetector.js'
      - 'services/core/tests/engine18LevelEventDetector.test.js'
      - '.github/workflows/engine18-trackb-level-detector.yml'
jobs:
  offline:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check services/core/logic/engine18/engine18LevelEventDetector.js
      - run: node --test services/core/tests/engine18LevelEventDetector.test.js
