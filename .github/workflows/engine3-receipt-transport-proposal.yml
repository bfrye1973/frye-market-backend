name: Engine3 Receipt Transport Proposal (Offline)
on:
  pull_request:
    paths:
      - 'services/core/logic/engine3/fetchEngine3DiagnosticBars.js'
      - 'services/core/tests/engine3DiagnosticCandleFetch.phase3DB.test.js'
      - '.github/workflows/engine3-receipt-transport-proposal.yml'
jobs:
  transport-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and isolated mock bar / receipt parity
        run: |
          node --check services/core/logic/engine3/fetchEngine3DiagnosticBars.js
          node --test services/core/tests/engine3DiagnosticCandleFetch.phase3DB.test.js
