name: Engine29 Squeeze v2 Phase 2-3 tests

on:
  push:
    branches:
      - engine29-squeeze-v2-phase2-scoring
  workflow_dispatch: {}

jobs:
  squeeze-v2-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax checks
        run: |
          node --check services/core/logic/engine29/tacticalCharacter/squeezeV2Scoring.js
          node --check services/core/tests/engine29SqueezeV2Scoring.test.js
          node --check services/core/tests/engine29SqueezeV2Synthetic.test.js
          node --check services/core/tests/engine29SqueezeV2FalsePositive.test.js

      - name: Deterministic scoring unit tests
        run: node --test services/core/tests/engine29SqueezeV2Scoring.test.js

      - name: Synthetic squeeze regression matrix
        run: node --test services/core/tests/engine29SqueezeV2Synthetic.test.js

      - name: False-positive broad-move matrix
        run: node --test services/core/tests/engine29SqueezeV2FalsePositive.test.js
