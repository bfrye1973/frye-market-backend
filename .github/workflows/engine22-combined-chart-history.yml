name: Engine22 Combined Chart History Acceptance
on:
  pull_request:
    paths:
      - 'services/core/logic/engine22/wave/buildEngine22ChartAnchorsV1.js'
      - 'services/core/logic/engine22/wave/buildEngine22WaveStrategy.js'
      - 'services/core/logic/engine22/history/**'
      - 'services/core/tests/engine22CombinedChartHistoryAcceptance.test.js'
      - '.github/workflows/engine22-combined-chart-history.yml'
  workflow_dispatch:
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test services/core/tests/engine22CombinedChartHistoryAcceptance.test.js
