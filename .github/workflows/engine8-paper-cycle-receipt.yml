name: Engine8 PAPER receipt offline
on:
  pull_request:
    paths:
      - 'services/core/jobs/autoExecuteCanonicalPaperTrade.js'
      - 'services/core/routes/runAllEngines.js'
      - 'services/core/logic/trading/engine8PaperCycleReceipt.js'
      - 'services/core/tests/engine8PaperCycleReceipt.test.js'
      - '.github/workflows/engine8-paper-cycle-receipt.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check services/core/routes/runAllEngines.js
      - run: node --check services/core/jobs/autoExecuteCanonicalPaperTrade.js
      - run: node --test services/core/tests/engine8PaperCycleReceipt.test.js services/core/tests/engine28AAutoPaperEntryBridge.test.js
