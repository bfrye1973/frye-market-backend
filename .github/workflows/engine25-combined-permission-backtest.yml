name: engine25-combined-permission-backtest
on:
  workflow_dispatch:
  push:
    branches:
      - engine25-eod-spreadsheet-reconstruction
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: engine25-eod-spreadsheet-reconstruction
      - name: Reconstruct ES Master at 11am Arizona for 10/27-10/30
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          ES_RESEARCH_CONTRACT: ESZ6
        run: |
          set -euo pipefail
          for d in 27 28 29 30; do
            export ES_RESEARCH_CUTOFF="2026-10-${d}T18:00:00+00:00"
            export ES_RESEARCH_CUTOFF_AZ="2026-10-${d}T11:00:00-07:00"
            export ES_RESEARCH_OUT="/tmp/es-master-2026-10-${d}-1100.json"
            python -u scripts/research_es_master_multi_1100.py
          done
      - uses: actions/upload-artifact@v4
        with:
          name: es-master-1027-1030-1100
          path: /tmp/es-master-2026-10-*-1100.json
