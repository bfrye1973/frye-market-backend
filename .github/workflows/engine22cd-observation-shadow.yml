name: Engine22C-D Observation Shadow
on:
  pull_request:
    paths:
      - "services/core/logic/engine22/fibonacci/**"
      - "services/core/logic/engine22/invalidations/**"
      - "services/core/tests/engine22CDObservation.test.js"
      - ".github/workflows/engine22cd-observation-shadow.yml"
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test services/core/tests/engine22CDObservation.test.js services/core/tests/engine22V3DegreeFib.test.js services/core/tests/engine22SevenDegreeInvalidationsReadiness.test.js
