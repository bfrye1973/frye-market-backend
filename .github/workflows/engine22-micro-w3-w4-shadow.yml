name: Engine22 Micro W3 W4 Shadow
on:
  pull_request:
    paths:
      - 'services/core/logic/engine22/microV2/assessMicroW3TouchW4Shadow.js'
      - 'services/core/logic/engine22/wave/buildEngine22WaveStrategy.js'
      - 'services/core/tests/engine22MicroW3TouchW4Shadow.test.js'
      - '.github/workflows/engine22-micro-w3-w4-shadow.yml'
permissions:
  contents: read
jobs:
  shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run candidate evidence tests
        working-directory: services/core
        run: node --test tests/engine22MicroW3TouchW4Shadow.test.js
      - name: Inspect real ES 10m candles for target and reversal evidence
        shell: bash
        run: |
          curl -fsS --max-time 45 "https://frye-market-backend-1.onrender.com/api/v1/futures/ohlc?symbol=ES&timeframe=10m&limit=1500" -o "$RUNNER_TEMP/es10m.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const bars=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/es10m.json","utf8"));
            const ordered=bars.filter(b=>Number.isFinite(Number(b.time))&&Number.isFinite(Number(b.high))&&Number.isFinite(Number(b.close))).sort((a,b)=>a.time-b.time);
            const a=ordered.filter(b=>b.time*1000>=Date.parse("2026-10-12T00:00:00Z")&&b.time*1000+600000<=Date.now());
            const touched=a.filter(b=>b.high>=7887);const peak=a.reduce((p,b)=>!p||b.high>p.high?b:p,null);
            const first=touched[0],following=first?a.filter(b=>b.time>first.time):[];
            const utc=b=>b?new Date(b.time*1000).toISOString():null;
            console.log("W3_W4_REAL_CANDLE_PROOF",JSON.stringify({barsTotal:ordered.length,todayCompleted:a.length,
             latestCompleted:utc(a.at(-1)),first7887Touch:utc(first),touchHigh:first?.high??null,
             dailyPeak:peak?{time:utc(peak),high:peak.high}:null,
             afterTouchCount:following.length,lastTwoCloses:following.slice(-2).map(b=>({time:utc(b),close:b.close})),
             touchSourceId:first?"ES:10m:"+utc(first):null,
             readOnly:true,noAnchorPromotion:true},null,2));
          '
      - name: Inspect live W2 candle lineage in read-only ES snapshot
        shell: bash
        run: |
          curl -fsS --max-time 45 'https://frye-market-backend-1.onrender.com/api/v1/dashboard-snapshot?symbol=ES' -o "$RUNNER_TEMP/strategy.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const s=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/strategy.json","utf8"));
            const w=s.strategies?.["intraday_scalp@10m"]?.engine22WaveStrategy;
            const legacy=w?.currentWavelength?.degrees?.micro?.microSequence;
            const v2=w?.microV2Migration;
            const c=w?.microExecutionContext;
            console.log("W2_LINEAGE_AUDIT",JSON.stringify({
              snapshot:s.now,
              legacyActiveWave:legacy?.activeWave??null,
              legacyW2State:legacy?.w2Completion?.state??null,
              legacyW2Evidence:legacy?.w2Completion?.evidence??null,
              legacyW2ConfirmedAt:legacy?.w2ConfirmedAtBarTime??null,
              legacyW2CandidateLow:legacy?.w2CandidateLow??null,
              v2Available:v2?.available??null,
              microExecutionContextAvailable:c?.available??null,
              oldW3FibTarget:w?.microW2W3TransitionFibs?.w3Up?.levels?.find(l=>l.key==="e1000")?.price??null
            },null,2));
          '
