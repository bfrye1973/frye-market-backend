name: Engine22 current owner wave review references
on:
  pull_request:
    paths:
      - "services/core/logic/engine22/wave/buildSevenDegreeInvalidationsV1.js"
      - "services/core/tests/engine22CurrentWorkingWaveReview.test.js"
      - "services/core/tests/engine22SevenDegreeInvalidationsReadiness.test.js"
      - "services/core/tests/engine22SevenDegreeInvalidationsV1.test.js"
      - "services/core/tests/engine22SubminuteDUpOwnerWorking.test.js"
      - ".github/workflows/engine22-current-wave-review.yml"
permissions:
  contents: read
jobs:
  owner-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test services/core/tests/engine22CurrentWorkingWaveReview.test.js services/core/tests/engine22SevenDegreeInvalidationsReadiness.test.js services/core/tests/engine22SevenDegreeInvalidationsV1.test.js services/core/tests/engine22SubminuteDUpOwnerWorking.test.js services/core/tests/engine22MicroOct27OwnerW1W2.test.js
