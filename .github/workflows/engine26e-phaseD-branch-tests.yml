name: Engine26E Phase D Branch Tests

on:
  push:
    branches:
      - engine26e-blended-participation-v1

jobs:
  phase-d-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run Engine25 blended participation tests
        run: |
          node --test services/core/tests/engine25BlendedParticipation.test.js
          node services/core/tests/engine25ParticipationPublisher.test.js
          node --test services/core/tests/engine25BlendedParticipationPublishing.test.js
