name: Engine22 Subminute Nov5 ABC Research
on:
  pull_request:
    paths:
      - "services/core/logic/engine22/wave/buildCurrentWavelength.js"
      - "services/core/logic/engine22/wave/applyOwnerPriceTouchesV1.js"
      - "services/core/tests/engine22SubminuteNov5AbcResearch.test.js"
      - ".github/workflows/engine22-subminute-nov5-abc.yml"
  push:
    branches: ["engine22-subminute-nov5-abc-card"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check services/core/logic/engine22/wave/buildCurrentWavelength.js
      - run: node --check services/core/logic/engine22/wave/applyOwnerPriceTouchesV1.js
      - run: node --test services/core/tests/engine22SubminuteNov5AbcResearch.test.js services/core/tests/engine22MinuteAbcResearchNov5.test.js services/core/tests/engine22MinorW2TouchesNov5.test.js services/core/tests/engine22AuthorizedWorkingStructureV1.test.js
