name: Engine 11 calendar membership prototype
on:
  push:
    branches: [engine11-calendar-membership-prototype-v1]
  pull_request:
    paths:
      - services/core/logic/engine11/calendarEvidenceV1/**
      - services/core/logic/engine11/analyticalIntervalResearchV1/**
      - services/core/tests/engine11/calendarPrototype/**
      - .github/workflows/engine11-calendar-membership-prototype.yml
      - docs/architecture/ENGINE11_CALENDAR_MEMBERSHIP_PROTOTYPE_V1.md
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test services/core/tests/engine11/*.test.js services/core/tests/engine11/research/*.test.mjs services/core/tests/engine11/sourceV2/*.test.mjs services/core/tests/engine11/calendarResearch/*.test.mjs services/core/tests/engine11/calendarPrototype/*.test.mjs
  authentic-evidence:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[calendar-prototype-live]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: node services/core/tests/engine11/calendarPrototype/livePrototype.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine11-calendar-membership-evidence
          path: research-evidence/engine11-calendar-membership.json
          if-no-files-found: error
          retention-days: 30
