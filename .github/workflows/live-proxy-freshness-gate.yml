name: Live Proxy Freshness Gate

on:
  push:
    branches:
      - live-proxy-freshness-api-first-v1

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
      - name: Syntax
        run: |
          node --check services/core/routes/live.js
      - name: Tests
        run: |
          node --test services/core/tests/liveProxyFreshness.test.js
