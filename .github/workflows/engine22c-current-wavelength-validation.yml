name: Engine22C current wavelength validation

on:
  push:
    branches:
      - engine22c-current-wavelength-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine22c-backend-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-engine22c:
    if: github.ref == 'refs/heads/engine22c-current-wavelength-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Engine22C branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check current wavelength syntax
        run: node --check services/core/logic/engine22/wave/buildCurrentWavelength.js

      - name: Check strategy wrapper syntax
        run: node --check services/core/logic/engine22/wave/buildEngine22WaveStrategy.js

      - name: Install declared backend dependencies
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Build isolated ES snapshot
        working-directory: services/core
        env:
          SYMBOL: ES
          NODE_ENV: test
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          POLY_KEY: ${{ secrets.POLY_KEY }}
        run: |
          if [ -z "$POLYGON_API_KEY" ] && [ -n "$POLY_KEY" ]; then
            export POLYGON_API_KEY="$POLY_KEY"
          fi
          if [ -z "$POLYGON_API_KEY" ]; then
            echo "Required Polygon credential unavailable to isolated CI" >&2
            exit 1
          fi
          node jobs/buildStrategySnapshot.js

      - name: Print and require current wavelength JSON
        working-directory: services/core
        run: |
          jq -e '.strategies["intraday_scalp@10m"].engine22WaveStrategy.currentWavelength' /opt/render/project/src/services/core/data/strategy-snapshot-es.json
          jq -e '.strategies["intraday_scalp@10m"].engine22WaveStrategy.currentWavelength.version == "engine22.currentWavelength.v1"' /opt/render/project/src/services/core/data/strategy-snapshot-es.json
          jq -e '.strategies["intraday_scalp@10m"].engine22WaveStrategy.currentWavelength | (.currentPrice != null or (.degrees.micro.state == "MICRO_W5_LAUNCH_WATCH" and .degrees.micro.confirmationStatus == "PENDING"))' /opt/render/project/src/services/core/data/strategy-snapshot-es.json
