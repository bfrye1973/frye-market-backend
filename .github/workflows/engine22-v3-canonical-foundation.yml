name: Engine22 V3 Canonical Foundation
on:
  push:
    branches: [engine22-v3-canonical-foundation-20261011]
  pull_request:
    paths:
      - "services/core/logic/engine22/v3/**"
      - "services/core/tests/engine22V3*.test.js"
permissions:
  contents: read
jobs:
  canonical-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check syntax
        run: |
          node --check services/core/logic/engine22/v3/canonicalStructure.js
          node --check services/core/logic/engine22/v3/proposeSubmicroMigration.js
          node --check services/core/logic/engine22/v3/evaluateWaveTransition.js
      - name: Run V3 isolated unit tests
        run: node --test services/core/tests/engine22V3*.test.js
      - name: Produce isolated V3 snapshot proof
        run: node services/core/tests/engine22V3SnapshotProof.js
      - name: Preserve isolated snapshot proof
        uses: actions/upload-artifact@v4
        with:
          name: engine22-v3-snapshot-proof
          path: ${{ runner.temp }}/engine22-v3-snapshot-proof.json
          if-no-files-found: error
      - name: Checkout exact production baseline for comparison
        uses: actions/checkout@v4
        with:
          ref: 9cee0f86682ea65e8182467c2049ec98b31643d0
          path: _engine22_production_baseline
      - name: Compare Engine22 outputs against exact production commit
        env:
          ENGINE22_BASE_CHECKOUT: ${{ github.workspace }}/_engine22_production_baseline
        run: node services/core/tests/engine22V3ExactCommitCompare.js
      - name: Preserve exact-commit comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine22-v3-exact-commit-compare
          path: ${{ runner.temp }}/engine22-v3-exact-commit-compare.json
          if-no-files-found: warn
