name: Engine22 Engine15 Engine16 Isolation Audit
on:
  push:
    branches: [audit-engine22-engine15-16-isolation-20261010]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Engine22 isolation diagnostic
        run: |
          node --test services/core/tests/engine22Engine15Engine16Isolation.audit.test.js
      - name: Install isolated backend deps
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Capture real ES Engine22 strategy inputs
        working-directory: services/core
        env:
          SYMBOL: ES
          NODE_ENV: test
          ENGINE22_ISOLATION_CAPTURE: "1"
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          POLY_KEY: ${{ secrets.POLY_KEY }}
        run: |
          if [ -z "$POLYGON_API_KEY" ] && [ -n "$POLY_KEY" ]; then export POLYGON_API_KEY="$POLY_KEY"; fi
          test -n "$POLYGON_API_KEY"
          node jobs/buildStrategySnapshot.js
          test -s /tmp/engine22-audit-real-input.json
      - name: Replay same ES input with Engine15 and Engine16 individually null
        working-directory: services/core
        env:
          NODE_ENV: test
          ENGINE22_ISOLATION_SKIP_MICRO_SHADOW: "1"
        run: node tests/engine22RealSnapshotIsolation.audit.mjs
      - name: Targeted legacy Engine16 opportunity gating
        working-directory: services/core
        run: node tests/engine22OpportunityIsolation.audit.mjs
