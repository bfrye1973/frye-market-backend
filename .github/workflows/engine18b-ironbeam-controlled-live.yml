name: Engine18B Ironbeam Controlled Live Source Preparation
on:
  push:
    branches: [engine18b-ironbeam-controlled-live-20261111]
  pull_request:
    paths:
      - 'services/core/logic/engine18/engine18IronbeamLiveRecorderSource.js'
      - 'services/core/logic/engine18/engine18ControlledLiveWorker.js'
      - 'services/core/logic/engine18/engine18ControlledLiveEntrypoint.js'
      - 'services/core/logic/engine18/engine18ControlledTrialVerifier.js'
      - 'services/core/logic/engine18/gate1RawRecorder.js'
      - 'services/core/tests/engine18LiveIronbeamSource.test.js'
      - '.github/workflows/engine18b-ironbeam-controlled-live.yml'
concurrency:
  group: engine18-live-prep-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-live-source-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions: {contents: read}
    strategy:
      fail-fast: false
      matrix:
        timezone: [UTC, America/Phoenix]
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check services/core/logic/engine18/engine18IronbeamLiveRecorderSource.js
      - run: node --check services/core/logic/engine18/engine18ControlledLiveWorker.js
      - run: node --check services/core/logic/engine18/engine18ControlledLiveEntrypoint.js
      - run: node --check services/core/logic/engine18/engine18ControlledTrialVerifier.js
      - run: node --test services/core/tests/engine18LiveIronbeamSource.test.js
      - run: node --test services/core/tests/engine18Gate1RawRecorder.test.js services/core/tests/engine18Phase2Preparation.test.js services/core/tests/engine18Phase3Readiness.test.js services/core/tests/engine18Phase4Readiness.test.js services/core/tests/engine18MergeBlockersR1R3.test.js services/core/tests/engine18Phase5Operations.test.js services/core/tests/engine18Issue300Acceptance.test.js services/core/tests/engine18Post301Readiness.test.js
