name: Engine22 Minute W2 owner hypothesis validation
on:
  pull_request:
    paths:
      - "services/core/logic/engine22/wave/buildCurrentWavelength.js"
      - "services/core/tests/engine22MinuteW2OwnerTriangleHypothesisV1.test.js"
      - ".github/workflows/engine22-minute-w2-owner-hypothesis.yml"
  push:
    branches:
      - engine22c-minute-w2-triangle-watch-20261021
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check services/core/logic/engine22/wave/buildCurrentWavelength.js
      - run: node --test services/core/tests/engine22MinuteW2OwnerTriangleHypothesisV1.test.js
