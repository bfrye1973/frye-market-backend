name: Engine22 Nov9 Submicro W3 Research
on:
  pull_request:
    paths:
      - 'services/core/logic/engine22/wave/buildCurrentWavelength.js'
      - 'services/core/logic/engine22/wave/applyOwnerPriceTouchesV1.js'
      - 'services/core/tests/engine22SubmicroW3Nov9Research.test.js'
      - '.github/workflows/engine22-submicro-w3-nov9.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check services/core/logic/engine22/wave/buildCurrentWavelength.js
      - run: node --check services/core/logic/engine22/wave/applyOwnerPriceTouchesV1.js
      - run: node --test services/core/tests/engine22SubmicroW3Nov9Research.test.js services/core/tests/engine22MicroSubmicroNov6Research.test.js
