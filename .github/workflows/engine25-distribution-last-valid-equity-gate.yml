name: Engine25 Distribution Last Valid Equity Gate

on:
  push:
    branches:
      - engine25-distribution-last-valid-equity-read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax
        run: node --check services/core/logic/engine25/buildDistributionPressureV2.js
      - name: Distribution v2 tests
        run: node --test services/core/tests/engine25DistributionPressureV2.test.js
