name: Engine22 Micro W2 hotfix validation

on:
  push:
    branches:
      - engine22-micro-w2-premature-lock-hotfix
  pull_request:
    paths:
      - "services/core/logic/engine22/wave/buildCurrentWavelength.js"
      - "services/core/logic/engine22/wave/buildEngine22WaveStrategy.js"
      - "services/core/logic/engine22/wave/runtimeStateStore.js"
      - "services/core/tests/engine22Micro*"
      - ".github/workflows/engine22-micro-w2-hotfix-validation.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax
        run: |
          node --check services/core/logic/engine22/wave/buildCurrentWavelength.js
          node --check services/core/logic/engine22/wave/buildEngine22WaveStrategy.js
          node --check services/core/logic/engine22/wave/runtimeStateStore.js

      - name: Micro lifecycle tests
        run: |
          node --test             services/core/tests/engine22MicroWaveSequence.test.js             services/core/tests/engine22MicroFiveMinuteEvidence.test.js             services/core/tests/engine22MicroRuntimePersistence.test.js
