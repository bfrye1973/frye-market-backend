name: Engine22 W4 A Fib Touches and Reviews
on:
  pull_request:
    paths:
      - "services/core/logic/engine22/wave/applyOwnerPriceTouchesV1.js"
      - "services/core/logic/engine22/wave/buildSevenDegreeInvalidationsV1.js"
      - "services/core/tests/engine22W4ADownTouchesReviews.test.js"
      - ".github/workflows/engine22-w4-a-touch-review.yml"
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test services/core/tests/engine22W4ADownTouchesReviews.test.js services/core/tests/engine22Oct28MicroW4SubmicroA.test.js services/core/tests/engine22SubmicroFiveUpOwnerOct27.test.js services/core/tests/engine22AuthorizedWorkingStructureV1.test.js
