name: Engine22 Wave History Journal V1
on:
  pull_request:
    paths:
      - 'services/core/logic/engine22/history/**'
      - 'services/core/tests/engine22WaveHistoryJournalV1.test.js'
      - 'services/core/tests/engine22WaveHistoryWorkbookV1.test.js'
      - 'services/core/jobs/buildStrategySnapshot.js'
      - '.github/workflows/engine22-wave-history-journal-v1.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check services/core/logic/engine22/history/waveHistoryJournalV1.js
          node --check services/core/logic/engine22/history/exportWaveHistoryWorkbookV1.js
          node --check services/core/tests/engine22WaveHistoryWorkbookV1.test.js
          node --check services/core/jobs/buildStrategySnapshot.js
          node --check services/core/tests/engine22WaveHistoryJournalV1.test.js
      - name: Immutable wave history tests
        run: node --test services/core/tests/engine22WaveHistoryJournalV1.test.js services/core/tests/engine22WaveHistoryWorkbookV1.test.js
