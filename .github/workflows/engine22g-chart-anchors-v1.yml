name: Engine22G Chart Anchors V1
on:
  pull_request:
    paths:
      - 'services/core/logic/engine22/wave/buildEngine22ChartAnchorsV1.js'
      - 'services/core/logic/engine22/wave/buildEngine22WaveStrategy.js'
      - 'services/core/tests/engine22ChartAnchorsV1.test.js'
      - '.github/workflows/engine22g-chart-anchors-v1.yml'
      - 'services/core/scripts/generateEngine22ChartAnchorsSample.js'
  workflow_dispatch:
jobs:
  chart-anchors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: |
          node --check services/core/logic/engine22/wave/buildEngine22ChartAnchorsV1.js
          node --check services/core/logic/engine22/wave/buildEngine22WaveStrategy.js
          node --check services/core/tests/engine22ChartAnchorsV1.test.js
      - name: Chart anchors regression
        run: node --test services/core/tests/engine22ChartAnchorsV1.test.js
      - name: Generate reproducible chart payload
        run: node services/core/scripts/generateEngine22ChartAnchorsSample.js
      - name: Upload generated payload
        uses: actions/upload-artifact@v4
        with:
          name: engine22g-chart-anchors-generated
          path: services/core/artifacts/engine22g/chart-anchors-generated.json
