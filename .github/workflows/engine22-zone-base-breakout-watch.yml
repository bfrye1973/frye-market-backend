name: Engine22 Negotiated Zone C Completion Early Watch
on:
  pull_request:
    paths:
      - "services/core/logic/engine22/completion/evaluateZoneBaseBreakoutWatch.js"
      - "services/core/tests/engine22ZoneBaseBreakoutWatch.test.js"
      - ".github/workflows/engine22-zone-base-breakout-watch.yml"
permissions:
  contents: read
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --check services/core/logic/engine22/completion/evaluateZoneBaseBreakoutWatch.js
      - run: node --test services/core/tests/engine22ZoneBaseBreakoutWatch.test.js services/core/tests/engine22IntegratedReplay.test.js
