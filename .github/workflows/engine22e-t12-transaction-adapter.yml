name: Engine22E T1.2 Transaction Adapter
on:
  pull_request:
    paths:
      - "services/core/logic/engine22/history/**"
      - "services/core/tests/engine22HistoryTransactionAdapter.test.js"
      - ".github/workflows/engine22e-t12-transaction-adapter.yml"
permissions:
  contents: read
jobs:
  transaction-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test services/core/tests/engine22HistoryTransactionAdapter.test.js services/core/tests/engine22V3CanonicalStructure.test.js
