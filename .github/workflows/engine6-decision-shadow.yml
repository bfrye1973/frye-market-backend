name: Engine6 Strategy1 Stages1-3 Baseline and Shadow
on:
  pull_request:
    paths:
      - "services/core/logic/engine6/evaluateZoneRotationDecision.js"
      - "services/core/tests/engine6ZoneRotationDecision.test.js"
      - "services/core/tests/engine6PhaseD3FocusedCorrection.test.js"
      - "services/core/tests/engine6ModularBoundaries.test.js"
      - "services/core/tests/engine6ApprovalLockExtraction.test.js"
      - "services/core/tests/engine6Stage4PermissionGate.test.js"
      - "services/core/jobs/buildStrategySnapshot.js"
      - "services/core/logic/engine6/**"
      - "services/core/logic/engine6/strategy1PermissionContract.js"
      - ".github/workflows/engine6-decision-shadow.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase4-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Historical Phase4 baseline — record failures, do not rewrite tests
        shell: bash
        run: |
          set +e
          node --test services/core/tests/engine6Strategy1Phase4.test.js > phase4-baseline.log 2>&1
          code=$?
          cat phase4-baseline.log
          echo "PHASE4_BASELINE_EXIT_CODE=$code" >> "$GITHUB_STEP_SUMMARY"
          echo '### Historical Phase4 baseline' >> "$GITHUB_STEP_SUMMARY"
          echo '\`\`\`text' >> "$GITHUB_STEP_SUMMARY"
          tail -55 phase4-baseline.log >> "$GITHUB_STEP_SUMMARY"
          echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Current Phase4 focused tests
        run: |
          node --test services/core/tests/engine6Strategy1Qualification.phaseD3.test.js
  isolated-decision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check services/core/logic/engine6/evaluateZoneRotationDecision.js
          node --check services/core/tests/engine6ZoneRotationDecision.test.js
      - name: Stage4 permission and sequencing regressions
        run: node --test services/core/tests/engine6Stage4PermissionGate.test.js
      - name: Engine6D lock extraction regressions
        run: node --test services/core/tests/engine6ApprovalLockExtraction.test.js
      - name: Modular boundaries and compatibility
        run: node --test services/core/tests/engine6ModularBoundaries.test.js
      - name: Eight focused D3 regressions
        run: node --test services/core/tests/engine6PhaseD3FocusedCorrection.test.js
      - name: Decision regressions
        run: node --test services/core/tests/engine6ZoneRotationDecision.test.js
      - name: Existing shadow regression
        run: node --test services/core/tests/engine6ZoneRotationContext.test.js
      - name: Adjacent PAPER pipeline contract regressions
        shell: bash
        run: |
          failures=0
          for file in \
            services/core/tests/engine7SingleSizingOwner.test.js \
            services/core/tests/engine26Engine7Engine9CombinedVerification.test.js \
            services/core/tests/engine8Engine10Strategy1Provenance.test.js \
            services/core/tests/engine26Strategy1V2BidirectionalRotation.test.js; do
            echo "=== $file ==="
            node --test "$file" || failures=$((failures+1))
          done
          echo "ADJACENT_PIPELINE_FAILED_SUITES=$failures" >> "$GITHUB_STEP_SUMMARY"
          exit "$failures"

      - name: Compare adjacent failures with untouched pre-Stage4 baseline
        if: always()
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin 55ef4b917ae37a6d2bab3a527a0b025a1e644eea
          git worktree add --detach /tmp/engine6-stage3-baseline 55ef4b917ae37a6d2bab3a527a0b025a1e644eea
          cd /tmp/engine6-stage3-baseline
          set +e
          for file in \
            services/core/tests/engine26Engine7Engine9CombinedVerification.test.js \
            services/core/tests/engine8Engine10Strategy1Provenance.test.js; do
            echo "=== PRE-STAGE4 BASELINE: $file ==="
            node --test "$file"
            echo "BASELINE_EXIT_$file=$?"
          done
          exit 0
