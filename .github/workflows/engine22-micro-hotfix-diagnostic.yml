name: Engine22 Micro Hotfix Diagnostic

on:
  push:
    branches:
      - engine22-micro-persistence-hotfix
  pull_request:
    paths:
      - ".github/workflows/engine22-micro-hotfix-diagnostic.yml"
      - "services/core/logic/engine22/wave/**"
      - "services/core/jobs/buildStrategySnapshot.js"
      - "services/core/tests/engine22Micro*"
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect live Micro state
        run: |
          set -e
          curl -fsS "https://frye-market-backend-1.onrender.com/api/v1/dashboard-snapshot?symbol=ES&includeContext=1"           | jq '{
              now,
              micro: .strategies["intraday_scalp@10m"].engine22WaveStrategy.currentWavelength.degrees.micro,
              microSequence: .strategies["intraday_scalp@10m"].engine22WaveStrategy.currentWavelength.degrees.micro.microSequence
            }'

      - name: Find today's Replay snapshots that had Micro W2
        run: |
          set -e
          times_json="$(curl -fsS "https://frye-market-backend-1.onrender.com/api/v1/replay/times?date=2026-10-09")"
          echo "$times_json" | jq '.'
          echo "$times_json" | jq -r '.times[]?' | while read -r t; do
            snap="$(curl -fsS "https://frye-market-backend-1.onrender.com/api/v1/replay/snapshot?date=2026-10-09&time=$t&symbol=ES" || true)"
            [ -n "$snap" ] || continue
            active="$(echo "$snap" | jq -r '.snapshot.engine27Strategies.engine27TraderIntelligenceV2.degrees.micro.activeWave // .engine27Strategies.engine27TraderIntelligenceV2.degrees.micro.activeWave // .snapshot.strategies["intraday_scalp@10m"].engine22WaveStrategy.currentWavelength.degrees.micro.microSequence.activeWave // .strategies["intraday_scalp@10m"].engine22WaveStrategy.currentWavelength.degrees.micro.microSequence.activeWave // empty')"
            if [ "$active" = "W2" ]; then
              echo "=== W2 SNAPSHOT $t ==="
              echo "$snap" | jq '{
                time: "'"$t"'",
                micro: (
                  .snapshot.strategies["intraday_scalp@10m"].engine22WaveStrategy.currentWavelength.degrees.micro //
                  .strategies["intraday_scalp@10m"].engine22WaveStrategy.currentWavelength.degrees.micro
                ),
                v2: (
                  .snapshot.engine27Strategies.engine27TraderIntelligenceV2.degrees.micro //
                  .engine27Strategies.engine27TraderIntelligenceV2.degrees.micro
                )
              }'
            fi
          done
