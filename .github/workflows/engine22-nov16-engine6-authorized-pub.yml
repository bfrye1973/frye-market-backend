name: Engine22 Nov16 Authorized Working Publication Engine6 Handoff
on:
  pull_request:
    branches: [main]
    paths:
      - 'services/core/logic/engine22/wave/ownerApprovedWorkingSelectionV1.js'
      - 'services/core/logic/engine22/wave/buildAuthorizedWorkingStructureV1.js'
      - 'services/core/logic/engine22/wave/buildCurrentWavelength.js'
      - 'services/core/tests/engine22Nov16AuthorizedEngine6Handoff.test.js'
      - '.github/workflows/engine22-nov16-engine6-authorized-pub.yml'
permissions:
  contents: read
jobs:
  authorized-working:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate latest owner wave source, authorized publication and strict engine27 parent chain
        run: |
          node --check services/core/logic/engine22/wave/ownerApprovedWorkingSelectionV1.js
          node --check services/core/logic/engine22/wave/buildAuthorizedWorkingStructureV1.js
          node --test services/core/tests/engine22Nov16AuthorizedEngine6Handoff.test.js services/core/tests/engine22OwnerSelectionRegistryV1.test.js services/core/tests/engine22AuthorizedWorkingStructureV1.test.js
