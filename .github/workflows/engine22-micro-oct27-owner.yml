name: Engine22 Micro owner W1 W2 anchors
on:
  pull_request:
    paths:
      - "services/core/logic/engine22/wave/buildCurrentWavelength.js"
      - "services/core/tests/engine22MicroOct27OwnerW1W2.test.js"
      - ".github/workflows/engine22-micro-oct27-owner.yml"
permissions:
  contents: read
jobs:
  micro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test services/core/tests/engine22MicroOct27OwnerW1W2.test.js services/core/tests/engine22SubminuteDUpOwnerWorking.test.js
