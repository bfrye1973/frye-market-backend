name: Engine22 Micro Lifecycle V2 Consistency Replay

on:
  push:
    branches:
      - engine22-micro-lifecycle-v2-consistency-replay
  pull_request:
    paths:
      - "services/core/logic/engine22/microV2/**"
      - "services/core/tests/engine22MicroConsistencyReplayV2.test.js"
      - ".github/workflows/engine22-micro-lifecycle-v2-consistency-replay.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax
        run: |
          node --check services/core/logic/engine22/microV2/buildMicroProjectionBundle.js
          node --check services/core/logic/engine22/microV2/processCanonicalMicroEventStream.js

      - name: Projection consistency and Replay equivalence
        run: |
          node --test             services/core/tests/engine22MicroConsistencyReplayV2.test.js             services/core/tests/engine22MicroExecutionContextV2.test.js             services/core/tests/engine22MicroFibTouchV2.test.js             services/core/tests/engine22MicroDurableCountsV2.test.js             services/core/tests/engine22MicroLifecycleReducerV2.test.js             services/core/tests/engine22MicroCanonicalStateV2.test.js

      - name: Existing Micro and Engine27 regressions
        run: |
          node --test             services/core/tests/engine22MicroWaveSequence.test.js             services/core/tests/engine22MicroFiveMinuteEvidence.test.js             services/core/tests/engine22MicroRuntimePersistence.test.js             services/core/tests/engine27TraderIntelligenceV2.test.js
