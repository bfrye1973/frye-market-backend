name: Engine26E Backend Live Validation
# rerun after canonical timeframe refresh

on:
  push:
    branches:
      - engine26e-blended-participation-v1

jobs:
  validate-live:
    runs-on: ubuntu-latest
    steps:
      - name: Validate production Engine25 full dashboard
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 3             https://frye-market-backend-1.onrender.com/api/v1/engine25/full-dashboard             -o /tmp/full-dashboard.json
          jq -e '.fastParticipation != null' /tmp/full-dashboard.json
          jq -e '.blendedParticipation != null' /tmp/full-dashboard.json
          jq -e '.sourceDiagnostics != null' /tmp/full-dashboard.json
          jq -e '.participationArtifact != null' /tmp/full-dashboard.json
          jq '{
            ok,
            fastParticipation,
            blendedParticipation,
            sourceDiagnostics: {
              "10m": .sourceDiagnostics["10m"],
              "1h": .sourceDiagnostics["1h"],
              "4h": .sourceDiagnostics["4h"],
              eod: .sourceDiagnostics.eod
            },
            legacyParticipationPresent: (.participationArtifact.participation != null)
          }' /tmp/full-dashboard.json
