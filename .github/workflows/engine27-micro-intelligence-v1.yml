name: Engine27 Micro Intelligence V1
on:
  pull_request:
    paths:
      - "services/core/logic/engine27/v2/buildMicroIntelligenceV1.js"
      - "services/core/logic/engine27/v2/buildUnifiedMarketContextV1.js"
      - "services/core/tests/engine27MicroIntelligenceV1.test.js"
      - "services/core/jobs/buildStrategySnapshot.js"
      - ".github/workflows/engine27-micro-intelligence-v1.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test services/core/tests/engine27MicroIntelligenceV1.test.js services/core/tests/engine27FinalE22OwnerSync20261025.test.js
      - run: |
          node --check services/core/logic/engine27/v2/buildMicroIntelligenceV1.js
          node --check services/core/jobs/buildStrategySnapshot.js
