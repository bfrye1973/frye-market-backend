name: Engine27 V6 Wave Journal Isolated
on:
  push:
    branches:
      - engine27-v6-wave-observation-journal-20261028
  pull_request:
    paths:
      - "services/core/logic/engine27/waveObservation/**"
      - "services/core/logic/engine27/tests/waveObservationJournal.test.js"
      - "services/core/logic/engine27/tests/microHistoricalReplayInventory.test.js"
      - "services/core/logic/engine27/tests/submicroHistoricalReplayInventory.test.js"
      - "services/core/logic/engine27/tests/compactWaveEvidence.test.js"
      - "services/core/logic/engine27/tests/waveZoneCandleStudy.test.js"
      - "services/core/logic/engine27/tests/waveNegotiatedZone.test.js"
      - "services/core/logic/engine27/tests/waveTransitionStudy.test.js"
      - "services/core/logic/engine27/tests/qualifyEngine3WaveCandle.test.js"
      - "services/core/logic/engine27/tests/fibReactionSequence.test.js"
      - "services/core/logic/engine27/tests/assembleWaveEvidence.test.js"
      - ".github/workflows/engine27-v6-wave-journal.yml"
jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Wave observation journal regression tests
        run: node --test services/core/logic/engine27/tests/waveObservationJournal.test.js services/core/logic/engine27/tests/microHistoricalReplayInventory.test.js services/core/logic/engine27/tests/submicroHistoricalReplayInventory.test.js services/core/logic/engine27/tests/compactWaveEvidence.test.js services/core/logic/engine27/tests/waveZoneCandleStudy.test.js services/core/logic/engine27/tests/waveNegotiatedZone.test.js services/core/logic/engine27/tests/waveTransitionStudy.test.js services/core/logic/engine27/tests/qualifyEngine3WaveCandle.test.js services/core/logic/engine27/tests/fibReactionSequence.test.js services/core/logic/engine27/tests/assembleWaveEvidence.test.js
      - name: Syntax check
        run: |
          node --check services/core/logic/engine27/waveObservation/createWaveObservationJournal.js
          node --check services/core/logic/engine27/waveObservation/inspectOct26MicroHistory.js
          node --check services/core/logic/engine27/waveObservation/inspectSubmicroHistory.js
          node --check services/core/logic/engine27/waveObservation/extractCompactWaveEvidence.js
          node --check services/core/logic/engine27/waveObservation/studyWaveZoneCandle.js
          node --check services/core/logic/engine27/waveObservation/studyWaveNegotiatedZone.js
          node --check services/core/logic/engine27/waveObservation/buildWaveTransitionStudy.js
          node --check services/core/logic/engine27/waveObservation/qualifyEngine3WaveCandle.js
          node --check services/core/logic/engine27/waveObservation/studyFibReactionSequence.js
          node --check services/core/logic/engine27/waveObservation/assembleWaveEvidence.js

  replay-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read-only Oct26-28 replay provenance availability
        run: |
          node services/core/jobs/auditEngine27V6MicroReplayOct26.js
          node services/core/jobs/auditEngine27Oct28WaveCompletionEvidence.js
          node services/core/jobs/auditEngine27Oct28FuturesCandles.js
          node services/core/jobs/auditEngine27RevisedMicroW3HighOct28.js
          node services/core/jobs/auditEngine27TwoWickOutcomesOct28.js
