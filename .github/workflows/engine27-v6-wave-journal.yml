name: Engine27 V6 Wave Journal Isolated
on:
  push:
    branches:
      - engine27-v6-wave-observation-journal-20261028
  pull_request:
    paths:
      - "services/core/logic/engine27/waveObservation/**"
      - "services/core/logic/engine27/tests/waveObservationJournal.test.js"
      - ".github/workflows/engine27-v6-wave-journal.yml"
jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Wave observation journal regression tests
        run: node --test services/core/logic/engine27/tests/waveObservationJournal.test.js
      - name: Syntax check
        run: node --check services/core/logic/engine27/waveObservation/createWaveObservationJournal.js
