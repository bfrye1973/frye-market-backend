name: dashboard-archive-10min

on:
  workflow_run:
    workflows: ["dashboard-10min (github-runner, debug-publish)"]
    types: [completed]
  workflow_dispatch: {}

jobs:
  archive:
    name: Archive Engine25 canonical 10m snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: engine25-10m-archive
      cancel-in-progress: false

    env:
      LIVE_BRANCH: data-live-10min
      ARCHIVE_BRANCH: data-archive-10min
      HISTORY_ROOT: data/engine25-10m-history
      RETENTION_DAYS: "30"

    steps:
      - name: Skip if live job failed
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' }}
        run: |
          echo "Live job conclusion=${{ github.event.workflow_run.conclusion }} — skipping archive."
          exit 0

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch canonical live snapshot
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${LIVE_BRANCH}"
          mkdir -p /tmp/engine25-live
          git show "origin/${LIVE_BRANCH}:data/outlook_intraday.json" > /tmp/engine25-live/outlook_intraday.json
          test -s /tmp/engine25-live/outlook_intraday.json

      - name: Build immutable Engine25 archive record
        id: snapshot
        run: |
          set -euo pipefail
          RESULT=$(python scripts/archive_engine25_10m.py build             --input /tmp/engine25-live/outlook_intraday.json             --stage-dir /tmp/engine25-archive-stage             --history-root "${HISTORY_ROOT}"             --live-branch "${LIVE_BRANCH}")
          echo "${RESULT}"
          ARCH_PATH=$(python -c 'import json,sys; print(json.load(sys.stdin)["archive_rel"])' <<< "${RESULT}")
          SOURCE_TS=$(python -c 'import json,sys; print(json.load(sys.stdin)["source_ts"])' <<< "${RESULT}")
          echo "archive_rel=${ARCH_PATH}" >> "${GITHUB_OUTPUT}"
          echo "source_ts=${SOURCE_TS}" >> "${GITHUB_OUTPUT}"

      - name: Checkout archive branch
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${ARCHIVE_BRANCH}"
          git checkout -B "${ARCHIVE_BRANCH}" "origin/${ARCHIVE_BRANCH}"

      - name: Install immutable snapshot
        run: |
          set -euo pipefail
          ARCH_PATH="${{ steps.snapshot.outputs.archive_rel }}"
          if [ -e "${ARCH_PATH}" ]; then
            echo "::error::archive collision at ${ARCH_PATH}; refusing to overwrite historical data"
            exit 1
          fi
          mkdir -p "${ARCH_PATH}"
          cp /tmp/engine25-archive-stage/engine25_10m_snapshot.json "${ARCH_PATH}/engine25_10m_snapshot.json"
          cp /tmp/engine25-archive-stage/outlook_intraday.json "${ARCH_PATH}/outlook_intraday.json"

      - name: Enforce rolling 30-day retention
        run: |
          set -euo pipefail
          python scripts/archive_engine25_10m.py prune             --history-root "${HISTORY_ROOT}"             --retention-days "${RETENTION_DAYS}"

      - name: Validate staged archive
        run: |
          set -euo pipefail
          ARCH_PATH="${{ steps.snapshot.outputs.archive_rel }}"
          test -s "${ARCH_PATH}/engine25_10m_snapshot.json"
          test -s "${ARCH_PATH}/outlook_intraday.json"
          python - << 'PY'
          import json
          from pathlib import Path

          p = Path("${{ steps.snapshot.outputs.archive_rel }}") / "engine25_10m_snapshot.json"
          j = json.loads(p.read_text(encoding="utf-8"))

          assert j["schema"] == "engine25.marketInternals10mArchive@1"
          assert j["timeframe"] == "10m"
          assert j["sourceTimestamp"] == "${{ steps.snapshot.outputs.source_ts }}"
          assert isinstance(j["sectorCards"], list)
          assert len(j["sectorCards"]) == 11
          assert j["strongSectorCount"] + j["neutralSectorCount"] + j["weakSectorCount"] == 11
          assert j["advancingStocks"] is not None
          assert j["decliningStocks"] is not None
          assert j["newHighs"] is not None
          assert j["newLows"] is not None
          print("archive validation PASS:", p)
          PY

      - name: Commit archive and retention changes
        run: |
          set -euo pipefail
          git config user.email "user@local"
          git config user.name "CI Bot"

          git add -A "${HISTORY_ROOT}"
          if git diff --cached --quiet; then
            echo "Nothing new to archive."
            exit 0
          fi

          git commit -m "Engine25 10m archive ${{ steps.snapshot.outputs.source_ts }}"
          git push origin "${ARCHIVE_BRANCH}"

      - name: Done
        run: |
          echo "::notice::Engine25 10m snapshot archived with rolling 30-day retention"
          echo "sourceTimestamp=${{ steps.snapshot.outputs.source_ts }}"
          echo "archivePath=${{ steps.snapshot.outputs.archive_rel }}"
