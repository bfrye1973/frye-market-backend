name: engine4-independent-5m-test

on:
  push:
    branches:
      - engine4-independent-5m-participation-v1
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax checks
        run: |
          node --check services/core/logic/engine4/participation/buildParticipation5m.js
          node --check services/core/logic/engine4/participation/computeVolumeMetadata.js
          node --check services/core/logic/engine4/contracts/buildEngine4BaseResult.js
          node --check services/core/logic/engine4/buildAuthorizedReactionParticipation.js
          node --check services/core/tests/engine4Participation5m.independentAuthority.test.js
          node --check services/core/tests/engine4ParticipationAuthority.phaseE.test.js
      - name: Engine 4 focused tests
        working-directory: services/core
        run: |
          node tests/engine4Participation5m.independentAuthority.test.js
          node tests/engine4ParticipationAuthority.phaseE.test.js
          node tests/engine4AuthorizedReactionParticipation.phaseD3.observationLayer.test.js

      - name: Oct 6 replay inventory
        run: |
          curl -fsS "https://frye-market-backend-1.onrender.com/api/v1/replay/es/times?date=2026-10-06" | tee /tmp/oct6-times.json
          echo
          cat /tmp/oct6-times.json
