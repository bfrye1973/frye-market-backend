name: Engine18 Rithmic Paper Step A (offline)
on:
  pull_request:
    paths:
      - 'services/core/logic/engine18/engine18RithmicPaperProbe.js'
      - 'services/core/logic/engine18/engine18RithmicPaperRenderServer.js'
      - 'services/core/tests/engine18RithmicPaperProbe.test.js'
      - 'services/core/logic/engine18/engine18RithmicPaperHistoryReplay.js'
      - 'services/core/tests/engine18RithmicPaperHistoryReplay.test.js'
      - 'services/core/logic/engine18/engine18FlowReader.js'
      - 'services/core/tests/engine18FlowReader.test.js'
      - 'services/core/logic/engine18/engine18LiquidityMap.js'
      - 'services/core/logic/engine18/engine18VolumeProfileCore.js'
      - 'services/core/tests/engine18LiquidityMap.test.js'
      - 'services/core/logic/engine18/engine18RithmicRenderTestServer.js'
      - '.github/workflows/engine18-rithmic-paper-step-a.yml'
jobs:
  offline:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --check services/core/logic/engine18/engine18RithmicPaperProbe.js
      - run: node --check services/core/logic/engine18/engine18RithmicPaperRenderServer.js
      - run: node --test services/core/tests/engine18RithmicPaperProbe.test.js services/core/tests/engine18RithmicPaperHistoryReplay.test.js services/core/tests/engine18FlowReader.test.js services/core/tests/engine18LiquidityMap.test.js
      - run: node --check services/core/logic/engine18/engine18RithmicRenderTestServer.js
      # Existing Test-system suites must stay green (shared helpers are imported, not changed).
      - run: node --test services/core/tests/engine18RithmicTestProbe.test.js services/core/tests/engine18RithmicConformanceTest.test.js services/core/tests/engine18RithmicDboEntitlementProbe.test.js
      # Disabled-by-default proof: with no env the CLI must not connect.
      - run: node services/core/logic/engine18/engine18RithmicPaperProbe.js 2>&1 | grep -q RITHMIC_PAPER_CONNECT_DISABLED
