name: Engine25 30m ES Globex Clock Gate

on:
  push:
    branches:
      - engine25-30m-es-globex-clock

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Workflow contract
        run: |
          set -euo pipefail
          grep -q 'cron: "5,35 \* \* \* 0-5"' .github/workflows/dashboard-30min-internals.yml
          grep -q 'Gate to ES/CME Globex 30m checkpoints' .github/workflows/dashboard-30min-internals.yml
          if grep -q 'workflow_run:' .github/workflows/dashboard-30min-internals.yml; then
            echo "30m workflow must not depend on 10m workflow_run clock"
            exit 1
          fi

      - name: Session rule checks
        run: |
          python - << 'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo

          def gate(iso):
              now = datetime.fromisoformat(iso.replace("Z","+00:00")).astimezone(ZoneInfo("America/New_York"))
              wd = now.weekday()
              if wd == 6:
                  valid = now.hour >= 18
              elif 0 <= wd <= 3:
                  valid = now.hour != 17
              elif wd == 4:
                  valid = now.hour < 17
              else:
                  valid = False
              if wd in [0,1,2,3,6] and now.hour == 18 and now.minute < 30:
                  valid = False
              return valid

          yes = [
              "2026-10-11T22:35:00Z", # Sun 18:35 ET
              "2026-10-12T04:05:00Z", # Mon 00:05 ET
              "2026-10-12T20:35:00Z", # Mon 16:35 ET
              "2026-10-16T20:35:00Z", # Fri 16:35 ET
          ]
          no = [
              "2026-10-11T22:05:00Z", # Sun 18:05 ET, no full post-open bar yet
              "2026-10-12T21:05:00Z", # Mon 17:05 ET maintenance
              "2026-10-16T21:05:00Z", # Fri after close
              "2026-10-17T16:05:00Z", # Sat
          ]

          assert all(gate(x) for x in yes), yes
          assert not any(gate(x) for x in no), no
          print("ES Globex 30m gate PASS")
          PY
