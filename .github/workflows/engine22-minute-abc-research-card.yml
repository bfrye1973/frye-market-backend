name: Engine22 Minute ABC Research Card
on:
  pull_request:
    paths:
      - "services/core/logic/engine22/wave/buildCurrentWavelength.js"
      - "services/core/logic/engine22/wave/applyOwnerPriceTouchesV1.js"
      - "services/core/tests/engine22MinuteAbcResearchNov5.test.js"
      - ".github/workflows/engine22-minute-abc-research-card.yml"
  push:
    branches: ["engine22-minute-abc-card-20261105"]
jobs:
  minute-abc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check services/core/logic/engine22/wave/buildCurrentWavelength.js
      - run: node --check services/core/logic/engine22/wave/applyOwnerPriceTouchesV1.js
      - run: node --test services/core/tests/engine22MinuteAbcResearchNov5.test.js services/core/tests/engine22MinuteW2FibTouches.test.js services/core/tests/engine22MinorW2TouchesNov5.test.js services/core/tests/engine22AuthorizedWorkingStructureV1.test.js
