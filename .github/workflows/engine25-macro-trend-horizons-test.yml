name: Engine25 Macro Trend Horizons Test

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node services/core/tests/engine25MacroTrendHorizons.test.js
