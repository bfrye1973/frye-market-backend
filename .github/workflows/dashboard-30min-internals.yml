name: dashboard-30min-internals

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["dashboard-10min (github-runner, debug-publish)"]
    types: [completed]

jobs:
  thirtymin_internals:
    name: Build & Publish Engine25 30m Internals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: engine25-30m-internals
      cancel-in-progress: false

    env:
      LIVE_BRANCH: data-live-30m-internals
      FD_30M_LOOKBACK: "3"
      FD_30M_DAYS: "5"
      FD_30M_MAX_WORKERS: "10"
      POLY_KEY: ${{ secrets.POLY_KEY }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Gate to completed regular-session 30m checkpoints
        id: session
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          UPSTREAM_CREATED_AT: ${{ github.event.workflow_run.created_at || '' }}
        run: |
          python - << 'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          event_name = os.environ.get("EVENT_NAME", "")
          conclusion = os.environ.get("UPSTREAM_CONCLUSION", "")
          created_at = os.environ.get("UPSTREAM_CREATED_AT", "")

          if event_name == "workflow_dispatch":
              valid = True
              reason = "MANUAL_VALIDATION"
              checkpoint = None
          elif conclusion != "success" or not created_at:
              valid = False
              reason = "UPSTREAM_10M_NOT_SUCCESSFUL"
              checkpoint = None
          else:
              source = datetime.fromisoformat(created_at.replace("Z", "+00:00"))
              ny = source.astimezone(ZoneInfo("America/New_York"))

              # The proven 10m workflow is the operating clock. Only its
              # :00/:30 scheduled observations may launch a 30m internals scan.
              # Allow a small GitHub scheduler-delay window around those slots.
              top_half = 0 <= ny.minute <= 9
              bottom_half = 30 <= ny.minute <= 39
              regular_checkpoint = (
                  (ny.hour == 10 and top_half)
                  or (10 <= ny.hour <= 15 and (top_half or bottom_half))
                  or (ny.hour == 16 and top_half)
              )
              valid = ny.weekday() < 5 and regular_checkpoint
              reason = "COMPLETED_30M_CHECKPOINT" if valid else "NOT_30M_CHECKPOINT"
              checkpoint = ny.isoformat()

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"run={'true' if valid else 'false'}\n")
              f.write(f"reason={reason}\n")

          print("event:", event_name)
          print("upstream conclusion:", conclusion or "n/a")
          print("upstream created_at:", created_at or "n/a")
          print("checkpoint NY:", checkpoint or "n/a")
          print("run:", valid, "reason:", reason)
          PY

      - name: Checkout repository
        if: steps.session.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        if: steps.session.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Engine25 full-market 30m internals
        if: steps.session.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          mkdir -p data
          python -u scripts/build_engine25_30m_internals.py             --sectors-dir data/sectors             --out data/outlook_30m_internals.json

      - name: Validate canonical contract
        if: steps.session.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python - << 'PY'
          import json
          from datetime import datetime

          p = "data/outlook_30m_internals.json"
          j = json.load(open(p, "r", encoding="utf-8"))

          assert j["schema"] == "engine25.marketInternals30m@1"
          assert j["timeframe"] == "30m"
          assert len(j["sectorCards"]) == 11
          assert j["strongSectorCount"] + j["neutralSectorCount"] + j["weakSectorCount"] == 11
          assert j["stocksScanned"] > 0
          assert j["stocksWithVolume"] > 0
          assert j["advancingStocks"] is not None
          assert j["decliningStocks"] is not None
          assert j["newHighs"] is not None
          assert j["newLows"] is not None
          assert j["coveragePct"] is not None

          source = datetime.fromisoformat(j["sourceTimestamp"].replace("Z", "+00:00"))
          generated = datetime.fromisoformat(j["generatedAt"].replace("Z", "+00:00"))
          assert generated >= source
          print("contract PASS", j["sourceTimestamp"], j["stocksScanned"], j["coveragePct"])
          PY

      - name: Stage artifacts
        if: steps.session.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p /tmp/engine25-30m
          cp data/outlook_30m_internals.json /tmp/engine25-30m/outlook_30m_internals.json

      - name: Publish live branch
        if: steps.session.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          git config user.email "bot@users.noreply.github.com"
          git config user.name "Engine25 CI"

          if git ls-remote --exit-code --heads origin "$LIVE_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$LIVE_BRANCH"
            git checkout -B "$LIVE_BRANCH" "origin/$LIVE_BRANCH"
          else
            git checkout --orphan "$LIVE_BRANCH"
          fi

          find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +
          mkdir -p data
          cp /tmp/engine25-30m/outlook_30m_internals.json data/outlook_30m_internals.json

          git add data/outlook_30m_internals.json
          git commit -m "Engine25 30m internals $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || exit 0
          git push --force origin "$LIVE_BRANCH"
