name: Engine 11 two year ES readiness
on:
  push:
    branches: [engine11-two-year-es-readiness-v1]
  pull_request:
    paths:
      - services/core/logic/engine11/twoYearResearchV1/**
      - services/core/tests/engine11/twoYearResearch/**
      - .github/workflows/engine11-two-year-readiness.yml
      - docs/architecture/ENGINE11_TWO_YEAR_ES_READINESS_V1.md
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test services/core/tests/engine11/*.test.js services/core/tests/engine11/research/*.test.mjs services/core/tests/engine11/sourceV2/*.test.mjs services/core/tests/engine11/calendarResearch/*.test.mjs services/core/tests/engine11/calendarPrototype/*.test.mjs services/core/tests/engine11/twoYearResearch/*.test.mjs
  authentic-two-year:
    if: github.event_name == 'push' && (contains(github.event.head_commit.message, '[two-year-live]') || contains(github.event.head_commit.message, '[schedules-live]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          SCHEDULES_ONLY: ${{ contains(github.event.head_commit.message, '[schedules-live]') }}
        run: |
          if [ "$SCHEDULES_ONLY" = "true" ]; then
            node services/core/tests/engine11/twoYearResearch/schedulesProbe.mjs
          else
            node services/core/tests/engine11/twoYearResearch/liveReadiness.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine11-two-year-original-evidence
          path: research-evidence/two-year-*.json
          if-no-files-found: error
          retention-days: 30
