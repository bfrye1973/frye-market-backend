name: Engine 27 V3 Micro isolated acceptance
on:
  pull_request:
    paths:
      - 'services/core/logic/engine27/v3/**'
      - '.github/workflows/engine27-v3-micro-isolated.yml'
  workflow_dispatch:
jobs:
  micro-price-fib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated Module 27.1
        run: node --test services/core/logic/engine27/v3/tests/priceActionFib.test.js services/core/logic/engine27/v3/tests/neighboringAlignment.test.js services/core/logic/engine27/v3/tests/marketConfirmation.test.js services/core/logic/engine27/v3/tests/positionIntelligence.test.js services/core/logic/engine27/v3/tests/entryThesisMemory.test.js services/core/logic/engine27/v3/tests/historicalValidation.test.js services/core/logic/engine27/v3/tests/microManagerIntegration.test.js services/core/logic/engine27/v3/tests/livePriceObserver.test.js services/core/logic/engine27/v3/tests/liveTradeSourceContract.test.js services/core/logic/engine27/v3/tests/tradeIngestion.test.js services/core/logic/engine27/v3/tests/tradeSseParser.test.js services/core/logic/engine27/v3/tests/microShadowView.test.js services/core/logic/engine27/v3/tests/snapshotMarketSources.test.js services/core/logic/engine27/v3/tests/canonicalOwnerMarket.test.js services/core/logic/engine27/v3/tests/marketEvidenceDisplay.test.js services/core/logic/engine27/v3/tests/engine29MicroDisplay.test.js services/core/logic/engine27/v3/tests/engine10MicroJournalAdapter.test.js services/core/logic/engine27/v3/tests/engine10SnapshotMicroAccount.test.js services/core/logic/engine27/v3/tests/qqqVixHourlyClose.test.js services/core/logic/engine27/v3/tests/directCrossMarketTick.test.js services/core/logic/engine27/v3/tests/liveCrossMarketZones.test.js services/core/logic/engine27/v3/tests/sharedMarketEventBus.test.js services/core/logic/engine27/v3/tests/sharedPolygonConnectionOwner.test.js services/core/logic/engine27/v3/tests/retireEngine5BStartup.test.js
      - name: Verify isolated shadow server syntax
        run: |
          node --check services/streamer/shadow/microShadowServer.js
          node --check services/streamer/shadow/createCrossMarketLiveObserver.js
          node --check services/streamer/sharedMarketData/createSharedMarketEventBus.js
          node --check services/streamer/sharedMarketData/createPolygonConnectionOwner.js
          node --check services/streamer/sharedMarketData/sharedMarketRuntime.js
          node --check services/streamer/sharedMarketData/sharedMarketRoutes.js
          node --check services/streamer/shadow/createSharedCrossMarketConsumer.js
          node --check services/streamer/routes/stream.js
          node --check services/streamer/routes/engine27V3TradeStream.js
      - name: Verify legacy Engine 27 compatibility
        run: |
          cd services/core
          node --test tests/engine27TraderIntelligenceV2.test.js tests/engine27WorkingSevenDegrees.test.js tests/engine27MicroIntelligenceV1.test.js tests/engine27Engine25Engine29Context20261025.test.js tests/engine27FinalE22OwnerSync20261025.test.js
