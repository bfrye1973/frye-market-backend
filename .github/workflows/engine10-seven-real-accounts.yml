name: Engine 10 Seven REAL Account Contract
on:
  pull_request:
    paths:
      - "services/core/logic/journal/**"
      - "services/core/tests/engine10*.test.js"
      - "services/core/engine10_oct22_offline_acceptance.mjs"
      - "services/core/engine10_seven_real_cutover_preflight.mjs"
      - "services/core/engine10_prepare_seven_real_cutover.mjs"
      - "services/core/engine10_apply_seven_real_cutover.mjs"
      - "services/core/routes/tradeJournal.js"
      - ".github/workflows/engine10-seven-real-accounts.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax checks
        run: |
          node --check services/core/logic/journal/tradeJournalStore.js
          node --check services/core/logic/journal/journalMaintenanceGuard.js
          node --check services/core/logic/journal/realAccountClassification.js
          node --check services/core/logic/journal/oct22ClassificationMigration.js
          node --check services/core/logic/journal/realPerformanceSections.js
          node --check services/core/engine10_oct22_offline_acceptance.mjs
          node --check services/core/engine10_seven_real_cutover_preflight.mjs
          node --check services/core/engine10_prepare_seven_real_cutover.mjs
          node --check services/core/engine10_apply_seven_real_cutover.mjs
          node --check services/core/routes/tradeJournal.js
      - name: Offline runner imports and guarded dry-run smoke test
        run: |
          node services/core/engine10_oct22_offline_acceptance.mjs > /tmp/engine10-acceptance-smoke.log 2>&1 && exit 1 || code=$?
          test "$code" -ne 0
          grep -q ENGINE8_OCT22_OPENINGS_FILE_REQUIRED /tmp/engine10-acceptance-smoke.log
          ! grep -q ERR_MODULE_NOT_FOUND /tmp/engine10-acceptance-smoke.log
      - name: Seven account contract tests
        run: |
          node --test services/core/tests/engine10SevenRealAccountClassification.test.js
          node --test services/core/tests/engine10Oct22ClassificationMigration.test.js
          node --test services/core/tests/engine10RealPerformanceSections.test.js
          node --test services/core/tests/engine10MinorOpeningPreflight.test.js
          node --test services/core/tests/engine10OfflineAcceptanceFixture.test.js
          node --test services/core/tests/engine10JournalMaintenanceGuard.test.js
      - name: Existing REAL accounting regression
        run: |
          node --test services/core/tests/engine10RealContractIdentity.test.js
          node --test services/core/tests/engine10RealMultiCampaignFifo.test.js
          node --test services/core/tests/engine10RealBrokerFillLegIdentity.test.js
          node --test services/core/tests/engine10RealFuturesExpirationIdentity.test.js
