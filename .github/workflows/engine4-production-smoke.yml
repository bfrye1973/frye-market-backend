name: engine4-production-smoke

on:
  push:
    branches:
      - engine4-independent-5m-participation-v1
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Production health
        run: |
          curl -fsS "https://frye-market-backend-1.onrender.com/api/health"
          echo

      - name: Verify merged source is on main
        run: |
          git fetch origin main
          git show origin/main:services/core/logic/engine4/participation/buildParticipation5m.js >/tmp/e4-5m.js
          grep -q "ENGINE4_5M_PARTICIPATION_INDEPENDENT" /tmp/e4-5m.js
          echo "MAIN_ENGINE4_INDEPENDENT_5M_PRESENT"

      - name: Production replay smoke
        run: |
          python - <<'PY'
          import json, time, urllib.request

          base = "https://frye-market-backend-1.onrender.com/api/v1"
          times_url = base + "/replay/es/times?date=2026-10-06"

          def get(url):
              req = urllib.request.Request(url, headers={"Cache-Control":"no-store","Accept":"application/json"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.load(r)

          latest = None
          for _ in range(12):
              data = get(times_url)
              times = data.get("times") or []
              if times:
                  latest = times[-1]
              if latest and latest >= "1657":
                  break
              time.sleep(10)

          print("LATEST_REPLAY_TIME", latest)
          if not latest:
              raise SystemExit("NO_REPLAY_TIMES")

          snap = get(
              base + "/replay/es/snapshot?date=2026-10-06&time=" + latest +
              "&strategyId=intraday_scalp%4010m"
          )
          strategy = (snap.get("strategies") or {}).get("intraday_scalp@10m") or {}
          e4 = (((strategy.get("confluence") or {}).get("context") or {}).get("volume") or {}).get("engine4AuthorizedReactionParticipation") or {}

          summary = {
              "time": latest,
              "state": e4.get("participationState"),
              "allowed": e4.get("allowed"),
              "hardBlocked": e4.get("hardBlocked"),
              "participation5mState": e4.get("participation5mState"),
              "participation5mSourceTimeframe": e4.get("participation5mSourceTimeframe"),
              "participation5mSourceValid": e4.get("participation5mSourceValid"),
              "participation5mCompleted": e4.get("participation5mCompleted"),
              "validation5mDirection": e4.get("validation5mDirection"),
              "broader10mVolumeTrend": e4.get("broader10mVolumeTrend"),
              "requiresEngine6Permission": e4.get("requiresEngine6Permission"),
              "noPermissionCreated": e4.get("noPermissionCreated"),
              "noExecution": e4.get("noExecution"),
          }
          print(json.dumps(summary, indent=2))

          required = [
              "participation5mState",
              "participation5mSourceTimeframe",
              "participation5mSourceValid",
              "participation5mCompleted",
          ]
          missing = [k for k in required if k not in e4]
          if missing:
              raise SystemExit("NEW_ENGINE4_FIELDS_MISSING: " + ",".join(missing))

          if e4.get("requiresEngine6Permission") is not True:
              raise SystemExit("ENGINE6_PERMISSION_BOUNDARY_MISSING")
          if e4.get("noPermissionCreated") is not True:
              raise SystemExit("ENGINE4_PERMISSION_SAFETY_FAILED")
          if e4.get("noExecution") is not True:
              raise SystemExit("ENGINE4_EXECUTION_SAFETY_FAILED")

          print("ENGINE4_PRODUCTION_SMOKE_PASS")
          PY
