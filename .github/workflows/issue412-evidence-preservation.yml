name: Issue412 evidence preservation script
on:
  pull_request:
    paths:
      - 'services/core/scripts/preserveIssue412Evidence.js'
      - 'services/core/tests/issue412EvidencePreservation.test.js'
      - '.github/workflows/issue412-evidence-preservation.yml'
permissions:
  contents: read
jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test services/core/tests/issue412EvidencePreservation.test.js
