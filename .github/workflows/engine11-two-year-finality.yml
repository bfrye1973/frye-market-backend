name: Engine 11 two year completeness and finality evidence
on:
  push:
    branches: [engine11-two-year-finality-evidence-v1]
  pull_request:
    paths:
      - services/core/logic/engine11/finalityResearchV1/**
      - services/core/tests/engine11/finalityResearch/**
      - .github/workflows/engine11-two-year-finality.yml
      - docs/architecture/ENGINE11_TWO_YEAR_FINALITY_EVIDENCE_V1.md
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test services/core/tests/engine11/*.test.js services/core/tests/engine11/research/*.test.mjs services/core/tests/engine11/sourceV2/*.test.mjs services/core/tests/engine11/calendarResearch/*.test.mjs services/core/tests/engine11/calendarPrototype/*.test.mjs services/core/tests/engine11/twoYearResearch/*.test.mjs services/core/tests/engine11/finalityResearch/*.test.mjs
  authentic-evidence:
    if: github.event_name == 'push' && (contains(github.event.head_commit.message, '[finality-live]') || contains(github.event.head_commit.message, '[guard-live]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          GUARD_ONLY: ${{ contains(github.event.head_commit.message, '[guard-live]') }}
        run: |
          if [ "$GUARD_ONLY" = "true" ]; then
            node services/core/tests/engine11/finalityResearch/guardEvidence.mjs
          else
            node services/core/tests/engine11/finalityResearch/liveEvidence.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine11-finality-original-and-sandbox-restore
          path: research-evidence/finality-*.json
          retention-days: 30
          if-no-files-found: error
