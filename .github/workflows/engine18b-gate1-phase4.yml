name: Engine18B Gate1 Phase4 Synthetic Reliability
on:
  push:
    branches: [engine18b-gate1-phase4-bounded-recovery-20261110]
  pull_request:
    paths:
      - 'services/core/logic/engine18/gate1RawRecorder.js'
      - 'services/core/logic/engine18/engine18BufferedRecorder.js'
      - 'services/core/logic/engine18/engine18BoundedRecovery.js'
      - 'services/core/logic/engine18/engine18Phase4Backup.js'
      - 'services/core/logic/engine18/engine18Phase4SyntheticWorker.js'
      - 'services/core/logic/engine18/engine18Phase4WorkerBridge.js'
      - 'services/core/tests/engine18Phase4Readiness.test.js'
      - '.github/workflows/engine18b-gate1-phase4.yml'
jobs:
  phase4-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check services/core/logic/engine18/engine18BoundedRecovery.js
      - run: node --check services/core/logic/engine18/engine18Phase4Backup.js
      - run: node --check services/core/logic/engine18/engine18Phase4SyntheticWorker.js
      - run: node --check services/core/logic/engine18/engine18Phase4WorkerBridge.js
      - run: node --test services/core/tests/engine18Gate1RawRecorder.test.js services/core/tests/engine18Phase2Preparation.test.js services/core/tests/engine18Phase3Readiness.test.js services/core/tests/engine18Phase4Readiness.test.js
