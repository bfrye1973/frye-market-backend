name: Engine25 1H Freshness 60-90 Gate

on:
  push:
    branches:
      - engine25-1h-freshness-60-90-v1

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax
        run: |
          node --check services/core/logic/engine25/buildBlendedParticipation.js
          node --check services/core/jobs/updateEngine25Participation.js
          node --check services/core/jobs/updateEngine25Full.js
      - name: Tests
        run: |
          node --test services/core/tests/engine25BlendedParticipation.test.js
          node --test services/core/tests/engine25BlendedParticipationPublishing.test.js
          node --test services/core/tests/engine25ParticipationPublisher.test.js
