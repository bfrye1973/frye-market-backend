name: Engine27 Seven Invalidation Card Integration
on:
  pull_request:
    paths:
      - "services/core/logic/engine27/v2/buildWorkingSevenDegrees.js"
      - "services/core/logic/engine27/v2/buildSevenInvalidationsV1.js"
      - "services/core/tests/engine27SevenInvalidationDisplay.test.js"
      - ".github/workflows/engine27-seven-invalidation-display.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test services/core/tests/engine27SevenInvalidationDisplay.test.js services/core/tests/engine27SevenInvalidationsV1.test.js
      - run: node --check services/core/logic/engine27/v2/buildWorkingSevenDegrees.js
