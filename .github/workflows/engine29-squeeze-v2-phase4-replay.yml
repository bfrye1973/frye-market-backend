name: Engine29 Squeeze v2 Phase 4 replay

on:
  push:
    branches:
      - engine29-squeeze-v2-phase2-scoring
  workflow_dispatch: {}

jobs:
  squeeze-v2-replay:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Engine25 immutable 10m archive
        run: |
          git fetch --no-tags origin data-archive-10min
          git worktree add /tmp/engine25-10m-archive origin/data-archive-10min

      - name: Fetch Engine25 immutable 30m archive
        run: |
          git fetch --no-tags origin data-archive-30m-internals
          git worktree add /tmp/engine25-30m-archive origin/data-archive-30m-internals

      - name: Oct 5 ES extraction
        run: |
          node --input-type=module - <<'NODE'
          const url = "https://frye-market-backend-1.onrender.com/api/v1/futures/ohlc?symbol=ES&tf=10m&limit=5000";
          const res = await fetch(url, { headers: { accept: "application/json", "cache-control": "no-store" } });
          if (!res.ok) throw new Error("ES OHLC HTTP " + res.status);
          const payload = await res.json();
          const rows = Array.isArray(payload) ? payload : (payload.bars || []);
          const toMs = (v) => {
            const n = Number(v);
            if (Number.isFinite(n)) return n < 1e12 ? n * 1000 : n;
            return Date.parse(v);
          };
          const start = Date.parse("2026-10-05T13:20:00Z");
          const end = Date.parse("2026-10-05T20:40:00Z");
          const bars = rows.map(b => ({
            t: toMs(b.time ?? b.t),
            o: Number(b.open ?? b.o),
            h: Number(b.high ?? b.h),
            l: Number(b.low ?? b.l),
            c: Number(b.close ?? b.c)
          })).filter(b => Number.isFinite(b.t) && b.t >= start && b.t <= end)
             .sort((a,b)=>a.t-b.t);
          console.log("OCT5_ES_10M " + JSON.stringify(bars));
          NODE

      - name: Run Squeeze v2 real-data replay
        env:
          ENGINE29_REPLAY_DATE: "2026-10-06"
          ENGINE25_10M_ARCHIVE_ROOT: "/tmp/engine25-10m-archive/data/engine25-10m-history"
          ENGINE25_30M_ARCHIVE_ROOT: "/tmp/engine25-30m-archive/data/engine25-30m-history"
          ENGINE29_REPLAY_BACKEND: "https://frye-market-backend-1.onrender.com"
        run: node services/core/qa/runEngine29SqueezeV2Replay.js
