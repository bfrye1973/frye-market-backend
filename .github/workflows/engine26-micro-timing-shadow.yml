name: Engine26 Micro Timing Shadow

on:
  push:
    branches:
      - engine22-micro-v2-engine26-shadow
  pull_request:
    paths:
      - "services/core/logic/engine26/strategy1/buildEngine26MicroTimingShadow.js"
      - "services/core/jobs/buildStrategySnapshot.js"
      - "services/core/tests/engine26MicroTimingShadow.test.js"
      - "services/core/tests/engine26MicroTimingShadowWiring.test.js"
      - ".github/workflows/engine26-micro-timing-shadow.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax
        run: |
          node --check services/core/logic/engine26/strategy1/buildEngine26MicroTimingShadow.js
          node --check services/core/jobs/buildStrategySnapshot.js

      - name: Engine26 Micro shadow tests
        run: |
          node --test \
            services/core/tests/engine26MicroTimingShadow.test.js \
            services/core/tests/engine26MicroTimingShadowWiring.test.js

      - name: Engine26 ownership regressions
        run: |
          node --test \
            services/core/tests/engine26Strategy1DirectionRegression.test.js \
            services/core/tests/engine26GeneralParentStrategy1Child.test.js \
            services/core/tests/engine26BPipeline.test.js

      - name: Engine22 and Engine27 regressions
        run: |
          node --test \
            services/core/tests/engine22MicroProductionMigrationV2.test.js \
            services/core/tests/engine22MicroConsistencyReplayV2.test.js \
            services/core/tests/engine27TraderIntelligenceV2.test.js
