name: Engine25 30m Scheduler Fix Gate

on:
  push:
    branches:
      - engine25-30m-internals-scheduler-fix

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Workflow contract
        run: |
          set -euo pipefail
          grep -q 'workflow_run:' .github/workflows/dashboard-30min-internals.yml
          grep -q 'dashboard-10min (github-runner, debug-publish)' .github/workflows/dashboard-30min-internals.yml
          if grep -q '^  schedule:' .github/workflows/dashboard-30min-internals.yml; then
            echo "Independent cron must not coexist with workflow_run clock"
            exit 1
          fi

      - name: Checkpoint rules
        run: |
          python - << 'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo

          def should_run(iso):
              dt = datetime.fromisoformat(iso.replace("Z", "+00:00")).astimezone(
                  ZoneInfo("America/New_York")
              )
              top = 0 <= dt.minute <= 9
              half = 30 <= dt.minute <= 39
              regular = (
                  (dt.hour == 10 and top)
                  or (10 <= dt.hour <= 15 and (top or half))
                  or (dt.hour == 16 and top)
              )
              return dt.weekday() < 5 and regular

          yes = [
              "2026-10-07T14:00:00Z", # 10:00 ET
              "2026-10-07T14:30:00Z", # 10:30 ET
              "2026-10-07T19:30:00Z", # 15:30 ET
              "2026-10-07T20:00:00Z", # 16:00 ET
          ]
          no = [
              "2026-10-07T13:50:00Z", # 09:50 ET
              "2026-10-07T14:10:00Z", # 10:10 ET
              "2026-10-07T14:20:00Z", # 10:20 ET
              "2026-10-07T14:40:00Z", # 10:40 ET
              "2026-10-07T20:10:00Z", # after final checkpoint
          ]

          assert all(should_run(x) for x in yes), yes
          assert not any(should_run(x) for x in no), no
          print("30m checkpoint gate PASS")
          PY
