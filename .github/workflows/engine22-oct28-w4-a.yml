name: Engine22 Oct28 W4 Submicro A
on:
  pull_request:
    paths:
      - "services/core/logic/engine22/wave/buildCurrentWavelength.js"
      - "services/core/logic/engine22/wave/ownerApprovedWorkingSelectionV1.js"
      - "services/core/tests/engine22Oct28MicroW4SubmicroA.test.js"
      - ".github/workflows/engine22-oct28-w4-a.yml"
permissions:
  contents: read
jobs:
  wave-transition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test services/core/tests/engine22Oct28MicroW4SubmicroA.test.js services/core/tests/engine22Oct28OwnerEndings.test.js services/core/tests/engine22SubmicroFiveUpOwnerOct27.test.js services/core/tests/engine22AuthorizedWorkingStructureV1.test.js
