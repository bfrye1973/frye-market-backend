name: dashboard-30min

on:
  workflow_dispatch: {}

jobs:
  thirtymin_internals:
    name: Build & Publish Engine25 30m Internals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: dashboard-30min
      cancel-in-progress: true

    env:
      LIVE_BRANCH: data-live-30m-internals
      ARCHIVE_BRANCH: data-archive-30m-internals
      HISTORY_ROOT: data/engine25-30m-history
      RETENTION_DAYS: "30"
      FD_30M_LOOKBACK: "3"
      FD_30M_DAYS: "5"
      FD_30M_MAX_WORKERS: "10"
      POLY_KEY: ${{ secrets.POLY_KEY }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preserve archive helper
        run: |
          set -euo pipefail
          cp scripts/archive_engine25_30m.py /tmp/archive_engine25_30m.py

      - name: Build Engine25 full-market 30m internals
        run: |
          set -euo pipefail
          mkdir -p data
          python -u scripts/build_engine25_30m_internals.py \
            --sectors-dir data/sectors \
            --out data/outlook_30m_internals.json

      - name: Validate canonical contract
        run: |
          python - << 'PY'
          import json
          from datetime import datetime

          p = "data/outlook_30m_internals.json"
          j = json.load(open(p, "r", encoding="utf-8"))

          assert j["schema"] == "engine25.marketInternals30m@1"
          assert j["timeframe"] == "30m"
          assert len(j["sectorCards"]) == 11
          assert j["strongSectorCount"] + j["neutralSectorCount"] + j["weakSectorCount"] == 11
          assert j["stocksScanned"] > 0
          assert j["stocksWithVolume"] > 0
          assert j["advancingStocks"] is not None
          assert j["decliningStocks"] is not None
          assert j["newHighs"] is not None
          assert j["newLows"] is not None
          assert j["coveragePct"] is not None

          source = datetime.fromisoformat(j["sourceTimestamp"].replace("Z", "+00:00"))
          generated = datetime.fromisoformat(j["generatedAt"].replace("Z", "+00:00"))
          assert generated >= source
          print("contract PASS", j["sourceTimestamp"], j["stocksScanned"], j["coveragePct"])
          PY

      - name: Stage artifacts
        run: |
          mkdir -p /tmp/engine25-30m
          cp data/outlook_30m_internals.json /tmp/engine25-30m/outlook_30m_internals.json

      - name: Publish live branch
        run: |
          set -euo pipefail
          git config user.email "bot@users.noreply.github.com"
          git config user.name "Engine25 CI"

          rm -f data/outlook_30m_internals.json

          if git ls-remote --exit-code --heads origin "$LIVE_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$LIVE_BRANCH"
            git checkout -B "$LIVE_BRANCH" "origin/$LIVE_BRANCH"
          else
            git checkout --orphan "$LIVE_BRANCH"
          fi

          find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +
          mkdir -p data
          cp /tmp/engine25-30m/outlook_30m_internals.json data/outlook_30m_internals.json

          git add data/outlook_30m_internals.json
          git commit -m "Engine25 30m internals $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || true
          git push --force origin "$LIVE_BRANCH"

      - name: Build immutable archive record
        id: snapshot
        run: |
          set -euo pipefail
          RESULT=$(python /tmp/archive_engine25_30m.py build \
            --input /tmp/engine25-30m/outlook_30m_internals.json \
            --stage-dir /tmp/engine25-30m-archive-stage \
            --history-root "$HISTORY_ROOT")
          echo "$RESULT"
          ARCH_PATH=$(python -c 'import json,sys; print(json.load(sys.stdin)["archive_rel"])' <<< "$RESULT")
          SOURCE_TS=$(python -c 'import json,sys; print(json.load(sys.stdin)["source_ts"])' <<< "$RESULT")
          echo "archive_rel=$ARCH_PATH" >> "$GITHUB_OUTPUT"
          echo "source_ts=$SOURCE_TS" >> "$GITHUB_OUTPUT"

      - name: Checkout archive branch
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$ARCHIVE_BRANCH" >/dev/null 2>&1; then
            git fetch --no-tags origin "$ARCHIVE_BRANCH"
            git checkout -B "$ARCHIVE_BRANCH" "origin/$ARCHIVE_BRANCH"
          else
            git checkout --orphan "$ARCHIVE_BRANCH"
            find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +
          fi

      - name: Install immutable archive snapshot
        run: |
          set -euo pipefail
          ARCH_PATH="${{ steps.snapshot.outputs.archive_rel }}"
          if [ -e "$ARCH_PATH" ]; then
            EXISTING_RAW="$ARCH_PATH/outlook_30m_internals.json"
            if [ -s "$EXISTING_RAW" ] && cmp -s "$EXISTING_RAW" /tmp/engine25-30m-archive-stage/outlook_30m_internals.json; then
              echo "identical snapshot already exists: $ARCH_PATH"
            else
              echo "::error::archive collision: same canonical timestamp has different data at $ARCH_PATH"
              exit 1
            fi
          else
            mkdir -p "$ARCH_PATH"
            cp /tmp/engine25-30m-archive-stage/engine25_30m_snapshot.json "$ARCH_PATH/engine25_30m_snapshot.json"
            cp /tmp/engine25-30m-archive-stage/outlook_30m_internals.json "$ARCH_PATH/outlook_30m_internals.json"
          fi

      - name: Enforce rolling 30-day retention
        run: |
          set -euo pipefail
          python /tmp/archive_engine25_30m.py prune \
            --history-root "$HISTORY_ROOT" \
            --retention-days "$RETENTION_DAYS"

      - name: Validate staged archive
        run: |
          set -euo pipefail
          ARCH_PATH="${{ steps.snapshot.outputs.archive_rel }}"
          test -s "$ARCH_PATH/engine25_30m_snapshot.json"
          test -s "$ARCH_PATH/outlook_30m_internals.json"

          python - << 'PY'
          import json
          from pathlib import Path

          p = Path("${{ steps.snapshot.outputs.archive_rel }}") / "engine25_30m_snapshot.json"
          j = json.loads(p.read_text(encoding="utf-8"))
          assert j["schema"] == "engine25.marketInternals30mArchive@1"
          assert j["timeframe"] == "30m"
          assert j["sourceTimestamp"] == "${{ steps.snapshot.outputs.source_ts }}"
          assert len(j["sectorCards"]) == 11
          print("archive validation PASS:", p)
          PY

      - name: Commit archive and retention changes
        run: |
          set -euo pipefail
          git config user.email "bot@users.noreply.github.com"
          git config user.name "Engine25 CI"

          git add -A "$HISTORY_ROOT"
          if git diff --cached --quiet; then
            echo "Nothing new to archive."
            exit 0
          fi

          git commit -m "Engine25 30m internals archive ${{ steps.snapshot.outputs.source_ts }}"
          git push origin "$ARCHIVE_BRANCH"
