name: Yield Symbol Discovery Live Call

on:
  pull_request:
    branches:
      - main

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Call discovery endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://frye-market-backend-1.onrender.com/api/v1/engine25/yield-symbol-discovery-temp -o /tmp/yields.json
          jq '.results' /tmp/yields.json
