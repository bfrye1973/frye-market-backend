name: Engine22C Seven Degree Invalidations V1
on:
  pull_request:
    paths:
      - "services/core/logic/engine22/wave/buildSevenDegreeInvalidationsV1.js"
      - "services/core/logic/engine22/wave/buildEngine22WaveStrategy.js"
      - "services/core/tests/engine22SevenDegreeInvalidationsV1.test.js"
      - "services/core/tests/engine22SevenDegreeInvalidationsReadiness.test.js"
      - ".github/workflows/engine22-seven-invalidations.yml"
permissions:
  contents: read
jobs:
  invalidation-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --check services/core/logic/engine22/wave/buildSevenDegreeInvalidationsV1.js
      - run: node --check services/core/logic/engine22/wave/buildEngine22WaveStrategy.js
      - run: node --test services/core/tests/engine22SevenDegreeInvalidationsV1.test.js services/core/tests/engine22SevenDegreeInvalidationsReadiness.test.js
