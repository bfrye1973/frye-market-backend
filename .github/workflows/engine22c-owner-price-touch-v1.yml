name: Engine22C Owner Price Touch V1
on:
  pull_request:
    paths:
      - "services/core/logic/engine22/wave/applyOwnerPriceTouchesV1.js"
      - "services/core/logic/engine22/wave/buildEngine22WaveStrategy.js"
      - "services/core/logic/engine22/wave/adapters/buildFuturesWaveContext.js"
      - "services/core/jobs/buildStrategySnapshot.js"
      - "services/core/tests/engine22OwnerPriceTouchPersistenceV1.test.js"
      - "services/core/tests/engine22MicroCPriceTouchV1.test.js"
      - "services/core/tests/engine22SubmicroCUpTouchV1.test.js"
      - "services/core/tests/engine22MicroBSubmicroADownWatch.test.js"
      - ".github/workflows/engine22c-owner-price-touch-v1.yml"
  push:
    branches:
      - engine22c-simple-price-touch-20261016
permissions:
  contents: read
jobs:
  owner-touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check services/core/logic/engine22/wave/applyOwnerPriceTouchesV1.js
      - run: node --check services/core/logic/engine22/wave/buildEngine22WaveStrategy.js
      - run: node --check services/core/jobs/buildStrategySnapshot.js
      - run: node --test services/core/tests/engine22OwnerPriceTouchPersistenceV1.test.js services/core/tests/engine22MicroCPriceTouchV1.test.js services/core/tests/engine22SubmicroCUpTouchV1.test.js services/core/tests/engine22MicroBSubmicroADownWatch.test.js
