name: Engine 8 durable REAL fill acknowledgment recovery
on:
  push:
    branches: [engine8a-durable-real-fill-ack-retry-v1]
  pull_request:
    paths:
      - "services/core/logic/trading/schwab/engine8RealAckVerification.js"
      - "services/core/logic/trading/schwab/reconcileDurablePendingRealFills.js"
      - "services/core/jobs/watchEngine8RealSchwabFills.js"
      - "services/core/tests/engine8DurableRealAckRecovery.test.js"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test services/core/tests/engine8DurableRealAckRecovery.test.js services/core/tests/engine8RealSchwabObserver.test.js services/core/tests/engine8ApprovedSchwabAccountDiscovery.test.js
      - run: |
          node --check services/core/jobs/watchEngine8RealSchwabFills.js
          node --check services/core/logic/trading/schwab/reconcileDurablePendingRealFills.js
