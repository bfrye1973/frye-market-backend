name: engine25-30m-archive-collision-tests

on:
  push:
    branches:
      - engine25/fix-30m-archive-collision
  workflow_dispatch:

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check
        run: |
          python -m py_compile \
            scripts/build_engine25_30m_internals.py \
            scripts/archive_engine25_30m.py \
            services/core/tests/engine25ThirtyMinuteInternals.test.py
      - name: Run Engine25 30m regression tests
        run: python services/core/tests/engine25ThirtyMinuteInternals.test.py
