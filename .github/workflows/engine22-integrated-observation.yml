name: Engine22 Integrated Observation Shadow
on:
  pull_request:
    paths:
      - "services/core/logic/engine22/integration/**"
      - "services/core/tests/engine22IntegratedObservation.test.js"
      - ".github/workflows/engine22-integrated-observation.yml"
permissions:
  contents: read
jobs:
  integrated-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Focused integration and V3 regressions
        run: |
          node --check services/core/logic/engine22/integration/buildIntegratedObservationShadow.js
          node --test services/core/tests/engine22IntegratedObservation.test.js services/core/tests/engine22ABRecognition.test.js services/core/tests/engine22V3SwingEvidence.test.js services/core/tests/engine22V3ProtectedContracts.test.js
