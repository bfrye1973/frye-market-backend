name: Engine27 Daily Degree Context
on:
  pull_request:
    paths:
      - "services/core/logic/engine27/v2/buildWorkingSevenDegrees.js"
      - "services/core/tests/engine27DailyDegreeContext.test.js"
      - ".github/workflows/engine27-daily-degree-context.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test services/core/tests/engine27DailyDegreeContext.test.js services/core/tests/engine27WorkingSevenDegrees.test.js
      - run: node --check services/core/logic/engine27/v2/buildWorkingSevenDegrees.js
