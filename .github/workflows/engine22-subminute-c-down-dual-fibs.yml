name: Engine22 Subminute C Down Dual Fibs
on:
  pull_request:
    paths:
      - "services/core/logic/engine22/wave/buildCurrentWavelength.js"
      - "services/core/logic/engine22/wave/applyOwnerPriceTouchesV1.js"
      - "services/core/tests/engine22SubminuteCDownOct31Fibs.test.js"
      - ".github/workflows/engine22-subminute-c-down-dual-fibs.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --check services/core/logic/engine22/wave/buildCurrentWavelength.js
      - run: node --check services/core/logic/engine22/wave/applyOwnerPriceTouchesV1.js
      - run: node --test services/core/tests/engine22SubminuteCDownOct31Fibs.test.js
