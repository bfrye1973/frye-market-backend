name: engine25-eod-spreadsheet-research
on:
  workflow_dispatch:
  push:
    branches:
      - engine25-eod-spreadsheet-reconstruction
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: engine25-eod-spreadsheet-reconstruction
      - name: Run Tech 10/29 reconstruction
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          python -u scripts/research_engine25_eod_spreadsheet.py --asof 2026-10-29 --csv data/sectors/tech.csv --out /tmp/eod-research.json
      - uses: actions/upload-artifact@v4
        with:
          name: eod-research
          path: /tmp/eod-research.json
      - name: Run current EOD shadow comparison
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          python -u scripts/engine25_eod_shadow_compare.py
      - uses: actions/upload-artifact@v4
        with:
          name: engine25-eod-shadow-compare
          path: /tmp/engine25-eod-shadow-compare.json
      - name: Score reconstructed EOD shadow
        run: |
          python -u scripts/score_engine25_eod_shadow.py \
            /tmp/engine25-eod-shadow-compare.json \
            /tmp/engine25-eod-shadow-score.json
      - uses: actions/upload-artifact@v4
        with:
          name: engine25-eod-shadow-score
          path: /tmp/engine25-eod-shadow-score.json
