<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>PAPER Trade Verification</title>
<!--
  #412 phone view. Display only: it reads Engine 12's protected
  /api/v1/trade-investigator/daily and /latest and shows what they say.
  It computes no verdicts, holds no data in this file, never puts the access
  key in a URL, and has no trading authority.
-->
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#15181d; --quiet:#5b6370; --line:#e3e6ea;
          --yes:#1d7a46; --yes-bg:#e5f4ec; --no:#8a5a00; --no-bg:#fbf1dc; --unk:#5b6370; --unk-bg:#eceff3; --bad:#b42318; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#181b21; --ink:#eef1f5; --quiet:#9aa3b0; --line:#2a2f37;
            --yes:#5fd393; --yes-bg:#123222; --no:#f0c060; --no-bg:#33270f; --unk:#b3bcc8; --unk-bg:#232830; --bad:#ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink);
         padding: max(12px, env(safe-area-inset-top)) 12px max(24px, env(safe-area-inset-bottom)); }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 4px 0 12px; }
  h2 { font-size: 15px; margin: 0 0 8px; color: var(--quiet); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; align-items: center; }
  input, button { font: inherit; border-radius: 10px; border: 1px solid var(--line); padding: 10px 12px; background: var(--card); color: var(--ink); }
  input[type=date] { flex: 1; min-width: 0; }
  button { background: var(--ink); color: var(--card); border-color: var(--ink); font-weight: 600; }
  button.ghost { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 500; }
  .verdict { border-radius: 12px; padding: 18px 14px; margin-bottom: 12px; }
  .verdict .big { font-size: 34px; font-weight: 800; letter-spacing: .02em; }
  .verdict .why { margin-top: 4px; }
  .v-YES { background: var(--yes-bg); color: var(--yes); }
  .v-NO { background: var(--no-bg); color: var(--no); }
  .v-UNKNOWN { background: var(--unk-bg); color: var(--unk); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .stat b { display: block; font-size: 22px; }
  .stat span { color: var(--quiet); font-size: 13px; }
  .kv { display: grid; grid-template-columns: 42% 58%; gap: 4px 8px; font-size: 14px; }
  .kv dt { color: var(--quiet); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  .chip { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--unk-bg); color: var(--unk); margin: 2px 4px 2px 0; overflow-wrap: anywhere; }
  .approval { border-top: 1px solid var(--line); padding: 10px 0; }
  .approval:first-child { border-top: 0; padding-top: 0; }
  .quiet { color: var(--quiet); font-size: 13px; }
  .err { color: var(--bad); font-weight: 600; }
  ul.plain { margin: 0; padding-left: 18px; font-size: 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>PAPER trade verification</h1>

  <section id="keyCard" class="card" hidden>
    <h2>Access</h2>
    <p class="quiet">Enter the Trade Investigator access key. It is sent only in a request header to this site, never in a link.</p>
    <form id="keyForm">
      <input id="keyInput" type="password" autocomplete="current-password" placeholder="Access key" style="width:100%;margin-bottom:8px">
      <label class="quiet"><input id="remember" type="checkbox"> Remember on this device</label>
      <div class="row" style="margin-top:10px"><button type="submit">Open</button></div>
    </form>
  </section>

  <section id="app" hidden>
    <div class="card row">
      <input id="date" type="date" aria-label="Arizona trading day">
      <button id="refresh" type="button">Refresh</button>
      <button id="forget" type="button" class="ghost" title="Remove the saved key">Lock</button>
    </div>
    <div id="status" class="quiet" style="margin:0 2px 10px"></div>
    <div id="out"></div>
  </section>
</main>

<script>
(function (root) {
  "use strict";

  // ---------- pure rendering (no DOM, no network): tested offline ----------

  var VERDICT_TEXT = {
    YES: "At least one PAPER fill is independently verified for this Arizona day.",
    NO: "Complete coverage is proven for this day, and no PAPER fill exists.",
    UNKNOWN: "Not enough trustworthy evidence to say YES or NO. This is not the same as “no trade”."
  };

  var LATEST_TEXT = {
    FILLED_JOURNALED: "Approved, filled, and recorded in the Journal.",
    FILLED_JOURNAL_RECORD_MATCHED_ACK_UNVERIFIED: "Approved and filled. The Journal record matches, but its acknowledgment is not verified.",
    FILLED_JOURNAL_UNKNOWN: "Approved and filled. The Journal record could not be verified.",
    ORDER_REPORTED_NO_INDEPENDENT_FILL: "Approved and an order was reported, but no fill is independently verified.",
    APPROVAL_REPORTED_SKIPPED: "Approved, but Engine 8 skipped it. See the blocker below.",
    APPROVAL_REPORTED_REJECTED: "Approved, but the execution request was rejected. See the reason below.",
    APPROVAL_REPORTED_NOT_INDEPENDENTLY_VERIFIED: "An approval was reported but is not independently verified yet.",
    UNKNOWN: "No approved trade was reported today, or the evidence is unavailable."
  };

  function esc(v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function verdictOf(v) { return v === "YES" || v === "NO" ? v : "UNKNOWN"; }
  function azTime(iso) {
    if (!iso) return "—";
    var t = Date.parse(iso);
    if (!isFinite(t)) return esc(iso);
    try {
      return new Intl.DateTimeFormat("en-US", { timeZone: "America/Phoenix", hour: "numeric", minute: "2-digit", second: "2-digit" }).format(new Date(t)) + " AZ";
    } catch (e) { return esc(iso); }
  }
  function chips(list) {
    if (!Array.isArray(list) || !list.length) return '<span class="quiet">none</span>';
    return list.map(function (x) { return '<span class="chip">' + esc(x) + "</span>"; }).join("");
  }
  function kv(pairs) {
    return '<dl class="kv">' + pairs.map(function (p) { return "<dt>" + esc(p[0]) + "</dt><dd>" + p[1] + "</dd>"; }).join("") + "</dl>";
  }
  function stat(n, label) {
    var shown = typeof n === "number" && isFinite(n) ? String(n) : "—";
    return '<div class="stat"><b>' + esc(shown) + "</b><span>" + esc(label) + "</span></div>";
  }

  function renderVerdict(daily) {
    var v = verdictOf(daily && daily.verdict);
    return '<div class="verdict v-' + v + '" role="status"><div class="quiet" style="color:inherit">' + esc(daily && daily.date) + " · Arizona day</div>" +
      '<div class="big">' + v + '</div><div class="why">' + esc(VERDICT_TEXT[v]) + "</div></div>";
  }

  function renderCoverage(daily) {
    var c = (daily && daily.coverage) || {};
    var trusted = c.trusted === true;
    return '<div class="card"><h2>Coverage</h2>' + kv([
      ["Evidence coverage", trusted ? "<b>VERIFIED</b>" : "<b>UNKNOWN</b>"],
      ["Why", esc(trusted ? "Trusted complete-day attestation" : (c.reason || "No trusted complete-day evidence"))],
      ["Evidence read", esc(azTime(daily && daily.evidenceReadAt))],
      ["Read stability", esc((daily && daily.evidenceStability) || "UNKNOWN")]
    ]) + "</div>";
  }

  function renderCounts(daily) {
    var k = (daily && daily.counts) || {};
    var r = (daily && daily.reportedAttempts) || {};
    return '<div class="card"><h2>Today</h2><div class="grid">' +
      stat(r.reportedApprovedCandidates, "approvals reported") +
      stat(r.reportedAttempts, "execution attempts") +
      stat(k.openingFills, "entries filled (verified)") +
      stat(k.exitFills, "exits filled (verified)") +
      stat(k.journalOpen, "Journal trades open") +
      stat(k.journalClosed, "Journal trades closed") +
      stat(k.pendingJournalAck, "Journal acks pending") +
      stat(k.journalUnverified, "fills not matched in Journal") +
      "</div></div>";
  }

  function renderLatest(latest) {
    if (!latest || typeof latest !== "object") return "";
    var st = latest.status || "UNKNOWN";
    var rep = latest.reported || null;
    var ind = latest.independent || {};
    var html = '<div class="card"><h2>Latest approval</h2><p style="margin:0 0 8px"><b>' + esc(LATEST_TEXT[st] || st) + "</b></p>";
    if (rep) {
      html += kv([
        ["First approved", esc(azTime(rep.firstObservedApprovalTime))],
        ["Last checked", esc(azTime(rep.lastObservedCycleTime))],
        ["Attempts", esc(rep.attemptCount)],
        ["Skip reason", esc(rep.skipReason || "—")],
        ["Reject reason", esc(rep.rejectReason || "—")],
        ["Blockers", chips(rep.blockers)],
        ["Order created (reported)", esc(rep.orderCreated === true ? "yes" : rep.orderCreated === false ? "no" : "unknown")],
        ["Fill (independent)", ind.fill ? esc(ind.fill.filledQuantity + " @ " + ind.fill.fillPrice + " · " + azTime(ind.fill.fillTime)) : "not verified"],
        ["Journal (independent)", esc((ind.journal && ind.journal.status) || "not verified")],
        ["Approval vs Replay", esc((ind.approvalReplay && ind.approvalReplay.status) || "UNKNOWN")]
      ]);
      html += '<p class="quiet" style="margin:8px 0 0">"Reported" fields come from Engine 8 receipts. Fill and Journal are independently checked by Engine 12.</p>';
    } else {
      html += '<p class="quiet" style="margin:0">No approved trade was reported today. See \u201cWhat the engines saw\u201d for each blocker.</p>';
    }
    return html + "</div>";
  }

  // Per-approval answers from Engine 12's `perApproval` field.
  function renderPerApproval(daily) {
    var list = daily && Array.isArray(daily.perApproval) ? daily.perApproval : null;
    if (!list) {
      return '<div class="card"><h2>Every approval today</h2><p class="quiet" style="margin:0">Waiting on Engine 12: the per-approval YES / NO / UNKNOWN list is not in its response yet. The latest approval above is shown in the meantime.</p></div>';
    }
    if (!list.length) return '<div class="card"><h2>Every approval today</h2><p class="quiet" style="margin:0">No approvals reported.</p></div>';
    return '<div class="card"><h2>Every approval today</h2>' + list.map(function (a) {
      var v = verdictOf(a && a.verdict);
      return '<div class="approval"><div class="row" style="justify-content:space-between"><b>' + esc(azTime(a && a.firstObservedApprovalTime)) + '</b><span class="chip v-' + v + '">' + v + "</span></div>" +
        '<div class="quiet">' + esc((a && (a.statusText || a.status)) || "") + "</div>" +
        (a && a.firstBlocker ? '<div class="quiet">First blocker: ' + esc(a.firstBlocker) + (a.firstBlockerSource === "ENGINE8_REPORTED_RECEIPT" ? " (reported by Engine 8)" : "") + "</div>" : "") +
        (a && a.independentOpeningFill ? '<div class="quiet">Filled ' + esc(a.independentOpeningFill.filledQuantity + " @ " + a.independentOpeningFill.fillPrice + " \u00b7 " + azTime(a.independentOpeningFill.fillTime)) + "</div>" : "") + "</div>";
    }).join("") + "</div>";
  }

  var ALERT_TEXT = {
    VERIFICATION_OBSERVER_STALE: "Verification records have stopped arriving.",
    SCHEDULER_RECEIPT_GAP: "Some scheduler runs are missing records.",
    RECEIPT_EVIDENCE_INVALID: "Some verification records failed integrity checks.",
    PENDING_JOURNAL_ACK: "A fill is waiting longer than expected for its Journal acknowledgment.",
    DURABLE_LEDGER_UNAVAILABLE: "The Engine 8 ledger could not be read reliably.",
    OBSERVER_HEALTH_UNAVAILABLE: "Health check unavailable."
  };

  function renderHealth(daily) {
    var h = daily && daily.observerHealth;
    var c = daily && daily.receiptCoverage;
    if (!h && !c) return "";
    var alerts = h && Array.isArray(h.alerts) ? h.alerts : [];
    var html = '<div class="card"><h2>Health</h2>';
    html += alerts.length
      ? '<ul class="plain">' + alerts.map(function (a) { return "<li>" + esc(ALERT_TEXT[a] || a) + "</li>"; }).join("") + "</ul>"
      : '<p class="quiet" style="margin:0 0 6px">No alerts from the verification observer.</p>';
    if (c) html += kv([
      ["Scheduler runs recorded", esc(c.schedulerRunsObserved == null ? "\u2014" : c.schedulerRunsObserved)],
      ["Runs with complete records", esc(c.completedObservedRuns == null ? "\u2014" : c.completedObservedRuns)],
      ["Skipped slots (scheduler busy)", esc(c.skippedSlotsObserved == null ? "\u2014" : c.skippedSlotsObserved)],
      ["Last record", esc(azTime(c.latestReceiptCreatedAt))]
    ]);
    return html + "</div>";
  }

  // Original Replay chronology: what Engine 6 and the first blocker looked like through the day.
  function renderObservedReplay(r) {
    if (!r || typeof r !== "object") return "";
    var rows = Array.isArray(r.rows) ? r.rows : [];
    var counts = r.firstBlockerCounts || {};
    var countText = Object.keys(counts).map(function (k) { return k + " \u00d7" + counts[k]; });
    var html = '<div class="card"><h2>What the engines saw (Replay)</h2>';
    if (!rows.length) return html + '<p class="quiet" style="margin:0">' + esc(r.reason || "No Replay snapshots for this day.") + "</p></div>";
    html += kv([
      ["Snapshots read", esc(r.snapshotsRead) + " of " + esc(r.snapshotsListed)],
      ["Approvals observed", esc(r.observedApprovals)],
      ["Summary", esc(r.classification === "NO_APPROVAL_OBSERVED" ? "No approval observed; blocked upstream" : r.classification === "APPROVAL_OBSERVED" ? "At least one approval observed" : "Unknown")],
      ["First blockers", countText.length ? chips(countText) : '<span class="quiet">none recorded</span>']
    ]);
    if (r.blockerAuthority === "INCLUDES_REGISTRY_UNVERIFIED_DATES") html += '<p class="quiet" style="margin:6px 0 0">Blockers are Engine 28A\u2019s recorded diagnosis; the authority registry is not yet proven for this date.</p>';
    html += '<p class="quiet" style="margin:6px 0 0">' + esc(r.note || "") + "</p>";
    return html + "</div>";
  }

  function renderFills(daily) {
    var fills = (daily && Array.isArray(daily.fills)) ? daily.fills : [];
    if (!fills.length) return "";
    return '<div class="card"><h2>Verified fills</h2>' + fills.map(function (f) {
      return '<div class="approval">' + kv([
        ["Time", esc(azTime(f.fillTime))],
        ["Action", esc(f.action)],
        ["Quantity @ price", esc(f.filledQuantity + " @ " + f.fillPrice)],
        ["Journal", esc((f.journal && f.journal.status) || "UNKNOWN")]
      ]) + "</div>";
    }).join("") + "</div>";
  }

  function renderIssues(daily) {
    var issues = daily && Array.isArray(daily.issues) ? daily.issues : [];
    var rep = daily && daily.reportedAttempts && Array.isArray(daily.reportedAttempts.issues) ? daily.reportedAttempts.issues : [];
    var all = issues.concat(rep.filter(function (x) { return issues.indexOf(x) < 0; }));
    if (!all.length) return "";
    return '<div class="card"><h2>Why evidence is incomplete</h2>' + chips(all) + "</div>";
  }

  function renderAll(daily, latest) {
    return renderVerdict(daily) + renderLatest(latest) + renderPerApproval(daily) + renderObservedReplay(daily && daily.observedReplay) +
      renderCounts(daily) + renderHealth(daily) + renderCoverage(daily) + renderFills(daily) + renderIssues(daily) +
      '<p class="quiet">' + esc((daily && daily.note) || "") + "</p>";
  }

  function errorText(status, body) {
    if (status === 401 || status === 403) return "The access key was not accepted.";
    if (status === 503) return "Verification is not switched on on the server yet (" + ((body && body.error) || "not configured") + ").";
    if (status === 404) return "No evidence for this day.";
    if (status === 429) return "Too many requests. Wait a minute and refresh.";
    return "Could not load verification (" + status + ").";
  }

  function arizonaToday(now) {
    var d = new Date((now || Date.now()) - 7 * 3600000);
    return d.toISOString().slice(0, 10);
  }

  root.PaperVerificationView = { renderAll: renderAll, renderVerdict: renderVerdict, renderLatest: renderLatest, renderPerApproval: renderPerApproval, renderHealth: renderHealth, renderObservedReplay: renderObservedReplay, errorText: errorText, arizonaToday: arizonaToday, esc: esc };

  // ---------- browser wiring ----------
  if (typeof document === "undefined") return;

  var KEY_NAME = "frye.tradeInvestigator.key";
  var API = "/api/v1/trade-investigator";
  var $ = function (id) { return document.getElementById(id); };
  var key = null;
  try { key = localStorage.getItem(KEY_NAME); } catch (e) { key = null; }

  function showKey() { $("keyCard").hidden = false; $("app").hidden = true; $("keyInput").focus(); }
  function showApp() { $("keyCard").hidden = true; $("app").hidden = false; }

  function get(kind, date) {
    return fetch(API + "/" + kind + "?date=" + encodeURIComponent(date), {
      method: "GET", headers: { "Accept": "application/json", "X-Trade-Investigator-Access": key },
      cache: "no-store", credentials: "omit", referrerPolicy: "no-referrer"
    }).then(function (r) {
      return r.json().catch(function () { return null; }).then(function (b) { return { status: r.status, body: b }; });
    });
  }

  function load() {
    var date = $("date").value || arizonaToday();
    $("status").textContent = "Loading…";
    Promise.all([get("daily", date), get("latest", date)]).then(function (rs) {
      var d = rs[0], l = rs[1];
      if (d.status === 401 || d.status === 403) {
        try { localStorage.removeItem(KEY_NAME); } catch (e) {}
        key = null; showKey(); $("status").textContent = ""; return;
      }
      if (d.status !== 200) { $("out").innerHTML = '<div class="card err">' + esc(errorText(d.status, d.body)) + "</div>"; $("status").textContent = ""; return; }
      $("out").innerHTML = renderAll(d.body, l.status === 200 ? l.body : null);
      $("status").textContent = "Updated " + azTime(new Date().toISOString());
    }).catch(function () {
      $("out").innerHTML = '<div class="card err">Network error. Check your connection and refresh.</div>';
      $("status").textContent = "";
    });
  }

  $("keyForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var k = $("keyInput").value.trim();
    if (!k) return;
    key = k;
    $("keyInput").value = "";
    if ($("remember").checked) { try { localStorage.setItem(KEY_NAME, k); } catch (err) {} }
    showApp(); load();
  });
  $("refresh").addEventListener("click", load);
  $("date").addEventListener("change", load);
  $("forget").addEventListener("click", function () {
    try { localStorage.removeItem(KEY_NAME); } catch (e) {}
    key = null; $("out").innerHTML = ""; showKey();
  });

  $("date").value = arizonaToday();
  if (key) { showApp(); load(); } else { showKey(); }
})(typeof window !== "undefined" ? window : globalThis);
</script>
</body>
</html>
